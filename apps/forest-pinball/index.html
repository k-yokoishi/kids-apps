<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>もりのピンボール</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg-top:#2f6b4f;--bg-bottom:#173d33;--field-top:#c8eaa4;--field-bottom:#86c98a;--wood:#8b5a3c;--wood-light:#b98159;--ink:#fff6dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg-top:#1b3a3a;--bg-bottom:#0c1d20;--field-top:#6f9c6a;--field-bottom:#3f6f55;--wood:#6d432b;--wood-light:#946446;--ink:#fff6dc}}
:root[data-theme="dark"]{--bg-top:#1b3a3a;--bg-bottom:#0c1d20;--field-top:#6f9c6a;--field-bottom:#3f6f55;--wood:#6d432b;--wood-light:#946446;--ink:#fff6dc}
html{height:100%;background:var(--bg-bottom)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg-bottom);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>

<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#c7f9cc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="もりの ピンボール">
<link rel="icon" href="../../icons/forest-pinball-192.png">
<link rel="apple-touch-icon" href="../../icons/forest-pinball-180.png">
</head>
<body>
<canvas id="c" aria-label="もりのピンボール。したのひだりとみぎをさわると、はっぱのフリッパーがうごきます"></canvas>
<script src="../../assets/vendor/matter.min.js"></script>
<script>
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
let W=0,H=0,SC=1,OX=0,OY=0,C={};
const WW=400,WH=700;
function readColors(){const s=getComputedStyle(document.documentElement);['bg-top','bg-bottom','field-top','field-bottom','wood','wood-light','ink'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);DPR=d;SC=Math.min(W/WW,H/WH);OX=(W-WW*SC)/2;OY=(H-WH*SC)/2;readColors();}
let DPR=1;addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}
resize();
if(!window.Matter){g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#fff';g.font=`900 20px ${FONT}`;g.textAlign='center';g.fillText('よみこみに しっぱいしました',W/2,H/2);return;}

/* ---------- sound & voice ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=0.95;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.getVoices();}catch(e){}
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5];
const lastS={};function sfx(key,gap,fn){const n=performance.now();if(lastS[key]&&n-lastS[key]<gap)return;lastS[key]=n;fn();}

/* ---------- physics world ---------- */
const{Engine,Bodies,Body,Composite,Events,Constraint}=Matter;
if(!Body.getVelocity)Body.getVelocity=b=>b.velocity;if(!Body.getSpeed)Body.getSpeed=b=>b.speed;
const engine=Engine.create();engine.gravity.y=0.9;engine.positionIterations=10;engine.velocityIterations=8;
const world=engine.world;
const CAT_WALL=1,CAT_BALL=2,CAT_FLIP=4;
const segs=[];
function seg(x1,y1,x2,y2,th=14,label='wall'){const len=Math.hypot(x2-x1,y2-y1);const b=Bodies.rectangle((x1+x2)/2,(y1+y2)/2,len+th,th,{isStatic:true,angle:Math.atan2(y2-y1,x2-x1),restitution:0.35,friction:0.01,label,chamfer:{radius:th/2-0.5}});
  b.seg={x1,y1,x2,y2,th,glow:0};Composite.add(world,b);segs.push(b);return b;}
Composite.add(world,[Bodies.rectangle(-20,350,60,900,{isStatic:true,label:'wall',restitution:0.3}),Bodies.rectangle(420,350,60,900,{isStatic:true,label:'wall',restitution:0.3}),Bodies.rectangle(200,-20,520,60,{isStatic:true,label:'wall',restitution:0.3})]);
seg(10,100,100,10,20);seg(300,10,390,100,20);
seg(10,515,112,602);seg(390,515,288,602);
const kL=seg(64,440,98,535,12,'kick');kL.kx=1;const kR=seg(336,440,302,535,12,'kick');kR.kx=-1;

const bumpers=[[125,238],[275,238],[200,330]].map(([x,y])=>{const b=Bodies.circle(x,y,24,{isStatic:true,label:'bump',restitution:0.6});b.sq=0;Composite.add(world,b);return b;});
const ANI=[{k:'owl',x:62,y:180,line:'ホーホー！ ふくろうだよ'},{k:'squirrel',x:338,y:180,line:'おはよう！ りすだよ'},{k:'hedgehog',x:200,y:452,line:'ちくちく！ はりねずみだよ'}];
ANI.forEach(a=>{a.body=Bodies.circle(a.x,a.y,22,{isStatic:true,label:'animal',restitution:0.5});a.body.ani=a;a.awake=false;a.hop=0;Composite.add(world,a.body);});

const spin=Body.create({parts:[Bodies.rectangle(200,112,100,10),Bodies.rectangle(200,112,10,100)],frictionAir:0.025,restitution:0.4,label:'spin'});
spin.parts.forEach(p=>p.label='spin');
Composite.add(world,[spin,Constraint.create({pointA:{x:200,y:112},bodyB:spin,pointB:{x:0,y:0},length:0,stiffness:1})]);

function makeFlipper(px,py,side){const L=72,T=15,rest=0.5,up=-0.48;const a0=side>0?rest:-rest;const dx=Math.cos(rest)*L/2*side,dy=Math.sin(rest)*L/2;
  const b=Bodies.rectangle(px+dx,py+dy,L,T,{angle:a0,density:0.04,frictionAir:0,friction:0.02,restitution:0.15,label:'flip',chamfer:{radius:7},collisionFilter:{category:CAT_FLIP,mask:CAT_BALL}});
  Composite.add(world,[b,Constraint.create({pointA:{x:px,y:py},bodyB:b,pointB:{x:-dx,y:-dy},stiffness:1,length:0})]);
  return{b,px,py,side,rest:a0,up:side>0?up:-up,on:0};}
const flips=[makeFlipper(118,606,1),makeFlipper(282,606,-1)];

const balls=[];let score=0,fest=0,frog={jump:0,said:0},usedFlip=false,respawnT=1.0;
function addBall(x,y){if(balls.length>=6)return;const b=Bodies.circle(clamp(x,108,292),y,11,{restitution:0.45,friction:0.005,frictionAir:0.0006,density:0.002,label:'ball',collisionFilter:{category:CAT_BALL}});b.still=0;
  Composite.add(world,b);balls.push(b);Body.setVelocity(b,{x:rand(-1,1),y:0});tone(700,0.2,'sine',0.1,0,300);}

const parts=[];
function burst(x,y,col,n,spd=160,kind='dot'){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=spd*rand(0.3,1);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rand(0.5,1),col,s:rand(2.5,5),kind});}}

function wake(a){a.hop=1;if(a.awake){sfx('ani',200,()=>tone(880,0.15,'sine',0.1));return;}a.awake=true;score+=5;say(a.line);[0,2,4].forEach((k,i)=>tone(PENTA[k+4],0.3,'triangle',0.12,i*0.08));burst(a.x,a.y,'#fff3a0',10,140,'star');
  if(ANI.every(q=>q.awake)){fest=11;setTimeout(()=>say('みんな おきた！ もりの おまつりだ！'),1300);[0,2,4,5,7,9,10].forEach((k,i)=>tone(PENTA[k],0.5,'triangle',0.12,1.2+i*0.1));setTimeout(()=>{addBall(120,40);addBall(280,40);},1500);}}

Events.on(engine,'beforeUpdate',()=>{
  for(const f of flips){const tgt=f.on>0?f.up:f.rest;Body.setAngularVelocity(f.b,clamp((tgt-f.b.angle)*0.55,-0.45,0.45));}
  for(const b of balls){const v=Body.getVelocity(b);const s=Math.hypot(v.x,v.y);if(s>19)Body.setVelocity(b,{x:v.x*19/s,y:v.y*19/s});}});
Events.on(engine,'collisionStart',e=>{for(const p of e.pairs){let a=p.bodyA.parent||p.bodyA,o=p.bodyB.parent||p.bodyB;if(o.label==='ball'&&a.label!=='ball'){const t=a;a=o;o=t;}if(a.label!=='ball')continue;
  const v=Body.getVelocity(a),sp=Math.hypot(v.x,v.y);
  if(o.label==='bump'){const dx=a.position.x-o.position.x,dy=a.position.y-o.position.y,d=Math.hypot(dx,dy)||1;Body.setVelocity(a,{x:dx/d*11,y:dy/d*11});o.sq=1;score++;burst(o.position.x+dx/d*24,o.position.y+dy/d*24,'#ffffff',6,120);
    sfx('bump'+o.id,60,()=>{const f=PENTA[bumpers.indexOf(o)*2+4];tone(f,0.25,'square',0.06);tone(f*2,0.2,'sine',0.08);});}
  else if(o.label==='kick'){Body.setVelocity(a,{x:o.kx*8,y:-8});o.seg.glow=1;sfx('kick',80,()=>tone(520,0.12,'triangle',0.14,0,900));}
  else if(o.label==='animal'){wake(o.ani);}
  else if(o.label==='spin'){score++;sfx('spin',90,()=>tone(1318,0.08,'sine',0.07));}
  else if(o.label==='flip'){sfx('flip',80,()=>tone(180,0.06,'triangle',0.1));}
  else if(sp>5){sfx('wall',70,()=>tone(140+sp*6,0.06,'triangle',0.06));}}});

/* ---------- input ---------- */
const ptrs=new Map();
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/SC,y:(e.clientY-r.top-OY)/SC};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const w=toWorld(e);
  if(w.y>470){const f=flips[w.x<200?0:1];f.on++;ptrs.set(e.pointerId,f);usedFlip=true;tone(240,0.07,'triangle',0.14,0,420);return;}
  for(const a of ANI){if(Math.hypot(w.x-a.x,w.y-a.y)<34){wake(a);return;}}
  if(w.y>20&&w.y<420)addBall(w.x,Math.max(40,Math.min(w.y,60)));});
function up(e){const f=ptrs.get(e.pointerId);if(f){f.on=Math.max(0,f.on-1);ptrs.delete(e.pointerId);}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- update ---------- */
function update(dt){
  for(let i=balls.length-1;i>=0;i--){const b=balls[i];
    if(b.position.y>WH+30||b.position.x<-40||b.position.x>WW+40){Composite.remove(world,b);balls.splice(i,1);frog.jump=1;burst(200,684,'#9fdcff',10,150);
      tone(300,0.25,'sine',0.14,0,120);if(performance.now()-frog.said>6000){frog.said=performance.now();say('けろっ！ もういっかい');}continue;}
    if(Body.getSpeed(b)<0.15)b.still+=dt;else b.still=0;if(b.still>2.5&&b.position.y<560){Body.setVelocity(b,{x:rand(-4,4),y:-5});b.still=0;}}
  if(balls.length===0){respawnT-=dt;if(respawnT<=0){addBall(rand(150,250),40);respawnT=1.4;}}else respawnT=1.4;
  bumpers.forEach(b=>b.sq=Math.max(0,b.sq-dt*4));segs.forEach(s=>s.seg.glow=Math.max(0,s.seg.glow-dt*3));ANI.forEach(a=>a.hop=Math.max(0,a.hop-dt*2));frog.jump=Math.max(0,frog.jump-dt*1.5);
  if(fest>0){fest-=dt;if(Math.random()<dt*3)burst(rand(60,340),rand(60,300),['#ff8fb1','#ffe066','#8fe3ff','#c5a3ff'][Math.floor(Math.random()*4)],18,140,'star');if(fest<=0)ANI.forEach(a=>a.awake=false);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;if(p.life>p.max)parts.splice(i,1);}}

/* ---------- drawing ---------- */
const leaves=Array.from({length:10},()=>({x:Math.random(),y:Math.random(),ph:Math.random()*TAU,s:rand(0.6,1.2)}));
function drawScreenBG(t){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,C['bg-top']);gr.addColorStop(1,C['bg-bottom']);g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(0,0,0,0.18)';for(let i=0;i<9;i++){const x=(i/8)*W,h=H*(0.35+0.2*((i*7)%3)/2),w=Math.max(40,W*0.08);g.beginPath();g.moveTo(x,H-h);g.lineTo(x-w,H);g.lineTo(x+w,H);g.closePath();g.fill();}
  for(const l of leaves){l.y+=0.0006;if(l.y>1.05)l.y=-0.05;const x=l.x*W+Math.sin(t+l.ph)*20,y=l.y*H;g.save();g.translate(x,y);g.rotate(Math.sin(t*1.5+l.ph));g.fillStyle='rgba(255,190,90,0.5)';g.beginPath();g.ellipse(0,0,7*l.s,3.5*l.s,0,0,TAU);g.fill();g.restore();}}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawField(t){rr(-6,-6,WW+12,WH+12,26);g.fillStyle=C.wood;g.fill();
  g.save();rr(4,4,WW-8,WH-8,20);g.clip();const gr=g.createLinearGradient(0,0,0,WH);gr.addColorStop(0,C['field-top']);gr.addColorStop(1,C['field-bottom']);g.fillStyle=gr;g.fillRect(0,0,WW,WH);
  g.fillStyle='rgba(255,255,255,0.12)';for(let i=0;i<40;i++){const x=(i*73)%WW,y=(i*131)%WH;g.beginPath();g.arc(x,y,3,0,TAU);g.fill();}
  // pond with frog under the drain
  g.fillStyle='#6cc3e8';g.beginPath();g.ellipse(200,700,120,48,0,0,TAU);g.fill();g.fillStyle='#8bd96c';g.beginPath();g.ellipse(200,690,26,10,0,0,TAU);g.fill();
  drawFrog(200,676-Math.sin(frog.jump*Math.PI)*22,t);
  if(fest>0){for(let i=0;i<6;i++){const x=40+i*64,y=40+Math.sin(t*2+i)*3;g.strokeStyle='rgba(80,50,30,0.5)';g.lineWidth=1.5;g.beginPath();g.moveTo(x,20);g.lineTo(x,y-10);g.stroke();g.fillStyle=['#ff8f70','#ffd84a','#ff7eb6'][i%3];g.shadowColor='#ffd84a';g.shadowBlur=12;g.beginPath();g.ellipse(x,y,9,12,0,0,TAU);g.fill();g.shadowBlur=0;}}
  g.restore();}
function drawFrog(x,y,t){g.fillStyle='#5cc65a';g.beginPath();g.ellipse(x,y,18,13,0,0,TAU);g.fill();for(const s of[-1,1]){g.beginPath();g.arc(x+s*9,y-10,7,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x+s*9,y-10,4.5,0,TAU);g.fill();g.fillStyle='#222';g.beginPath();g.arc(x+s*9,y-10,2.2,0,TAU);g.fill();g.fillStyle='#5cc65a';}
  g.strokeStyle='#2d6a2c';g.lineWidth=2;g.beginPath();g.arc(x,y-1,8,0.15*Math.PI,0.85*Math.PI);g.stroke();g.fillStyle='rgba(255,120,140,0.5)';for(const s of[-1,1]){g.beginPath();g.arc(x+s*12,y+2,3,0,TAU);g.fill();}}
function drawSegs(){for(const s of segs){const{x1,y1,x2,y2,th,glow}=s.seg;g.lineCap='round';
  if(s.label==='kick'){g.strokeStyle=glow>0?'#fff3a0':'#ff8fb1';g.lineWidth=th+(glow*4);g.shadowColor='#ffd84a';g.shadowBlur=glow*18;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.shadowBlur=0;continue;}
  g.strokeStyle=C.wood;g.lineWidth=th;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=C['wood-light'];g.lineWidth=th*0.35;g.beginPath();g.moveTo(x1,y1-th*0.15);g.lineTo(x2,y2-th*0.15);g.stroke();}}
function drawMushroom(b,i){const s=1+Math.sin(b.sq*Math.PI)*0.22;const{x,y}=b.position;g.save();g.translate(x,y);g.scale(s,s);
  g.fillStyle='rgba(0,0,0,0.15)';g.beginPath();g.ellipse(2,4,26,24,0,0,TAU);g.fill();
  g.fillStyle=['#ff5d6c','#ff9f43','#b779ff'][i];g.beginPath();g.arc(0,0,25,0,TAU);g.fill();g.fillStyle='#fff';[[0,-12,6],[-12,4,5],[12,5,5],[0,13,4],[-15,-8,3],[15,-8,3]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(dx,dy,r,0,TAU);g.fill();});
  if(b.sq>0){g.strokeStyle=`rgba(255,255,255,${b.sq})`;g.lineWidth=4;g.beginPath();g.arc(0,0,25+(1-b.sq)*14,0,TAU);g.stroke();}g.restore();}
function drawSpin(){g.save();g.translate(spin.position.x,spin.position.y);g.rotate(spin.angle);const cols=['#ff8fb1','#ffd84a','#7fd3ff','#9be07a'];
  for(let i=0;i<4;i++){g.rotate(TAU/4);g.fillStyle=cols[i];g.beginPath();g.moveTo(0,0);g.lineTo(50,-5);g.quadraticCurveTo(48,16,6,6);g.closePath();g.fill();}
  g.fillStyle='#fff';g.beginPath();g.arc(0,0,6,0,TAU);g.fill();g.restore();}
function eyes(x,y,gap,r,awake){g.lineCap='round';for(const s of[-1,1]){if(awake){g.fillStyle='#fff';g.beginPath();g.arc(x+s*gap,y,r,0,TAU);g.fill();g.fillStyle='#2b2233';g.beginPath();g.arc(x+s*gap,y+r*0.1,r*0.55,0,TAU);g.fill();}else{g.strokeStyle='#2b2233';g.lineWidth=2;g.beginPath();g.arc(x+s*gap,y-r*0.3,r*0.6,0.15*Math.PI,0.85*Math.PI);g.stroke();}}}
function drawAnimal(a,t){const hop=Math.sin(a.hop*Math.PI)*8;const x=a.x,y=a.y-hop;g.save();
  if(a.k==='owl'){g.fillStyle='#9b6b43';for(const s of[-1,1]){g.beginPath();g.moveTo(x+s*18,y-14);g.lineTo(x+s*16,y-30);g.lineTo(x+s*6,y-20);g.fill();}g.beginPath();g.ellipse(x,y,22,24,0,0,TAU);g.fill();g.fillStyle='#ecd3a8';g.beginPath();g.ellipse(x,y+8,13,13,0,0,TAU);g.fill();
    g.fillStyle='#f3e2c2';for(const s of[-1,1]){g.beginPath();g.arc(x+s*9,y-6,9,0,TAU);g.fill();}eyes(x,y-6,9,6,a.awake);g.fillStyle='#ff9f1c';g.beginPath();g.moveTo(x-3,y);g.lineTo(x+3,y);g.lineTo(x,y+6);g.fill();}
  else if(a.k==='squirrel'){g.fillStyle='#c46f35';g.beginPath();g.ellipse(x+14,y-4,14,22,0.4,0,TAU);g.fill();g.fillStyle='#e0894a';for(const s of[-1,1]){g.beginPath();g.arc(x+s*12,y-18,6,0,TAU);g.fill();}g.beginPath();g.arc(x,y,20,0,TAU);g.fill();g.fillStyle='#fbe3c4';g.beginPath();g.ellipse(x,y+7,11,9,0,0,TAU);g.fill();eyes(x,y-4,8,5,a.awake);g.fillStyle='#4a2c1a';g.beginPath();g.arc(x,y+3,2.5,0,TAU);g.fill();}
  else{g.fillStyle='#6b4a36';g.beginPath();for(let i=0;i<=28;i++){const an=Math.PI*0.9+i/28*Math.PI*1.2,r=i%2?20:27;g.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r);}g.lineTo(x+20,y+10);g.lineTo(x-20,y+10);g.closePath();g.fill();
    g.fillStyle='#f0d4b0';g.beginPath();g.ellipse(x,y+3,17,14,0,0,TAU);g.fill();eyes(x,y,7,4.5,a.awake);g.fillStyle='#2b2233';g.beginPath();g.arc(x,y+7,2.5,0,TAU);g.fill();}
  g.fillStyle='rgba(255,120,140,0.45)';for(const s of[-1,1]){g.beginPath();g.arc(x+s*12,y+6,3,0,TAU);g.fill();}
  if(!a.awake){g.fillStyle='rgba(255,255,255,0.9)';g.font=`900 12px ${FONT}`;for(let k=0;k<2;k++){const p=(t*0.5+k*0.5)%1;g.globalAlpha=1-p;g.fillText('z',x+16+p*10,y-22-p*18);}g.globalAlpha=1;}
  g.restore();}
function drawFlipper(f){const v=f.b.vertices;g.fillStyle='#4fb35a';g.beginPath();v.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fill();g.strokeStyle='#2f7d3b';g.lineWidth=2;g.stroke();
  const L=36,a=f.b.angle,cx=f.b.position.x,cy=f.b.position.y;g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=1.5;g.beginPath();g.moveTo(cx-Math.cos(a)*L*0.8,cy-Math.sin(a)*L*0.8);g.lineTo(cx+Math.cos(a)*L*0.8,cy+Math.sin(a)*L*0.8);g.stroke();
  g.fillStyle='#8b5a3c';g.beginPath();g.arc(f.px,f.py,5,0,TAU);g.fill();}
function drawBall(b){g.save();g.translate(b.position.x,b.position.y);g.rotate(b.angle);g.fillStyle='rgba(0,0,0,0.18)';g.beginPath();g.ellipse(2,4,11,10,0,0,TAU);g.fill();
  g.fillStyle='#c98a4b';g.beginPath();g.ellipse(0,2,10,11,0,0,TAU);g.fill();g.fillStyle='#8a5a32';g.beginPath();g.ellipse(0,-4,12,7,0,Math.PI,TAU);g.lineTo(12,-3);g.lineTo(-12,-3);g.fill();g.beginPath();g.rect(-1.5,-15,3,5);g.fill();
  g.fillStyle='rgba(255,255,255,0.45)';g.beginPath();g.ellipse(-4,3,2.5,4,0.3,0,TAU);g.fill();g.restore();}
function drawParts(){for(const p of parts){g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=p.col;g.beginPath();if(p.kind==='star'){for(let i=0;i<10;i++){const a=i*Math.PI/5,r=i%2?p.s*0.45:p.s*1.2;g.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);}}else g.arc(p.x,p.y,p.s,0,TAU);g.fill();}g.globalAlpha=1;}
const t0=performance.now()/1000;
function drawHUD(t){g.save();g.font=`900 ${Math.round(22)}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='rgba(60,35,20,0.55)';rr(150,26,100,32,16);g.fill();g.fillStyle='#fff6dc';g.fillText('⭐ '+score,200,43);
  if(!usedFlip){for(const x of[90,310]){const p=(t*0.9)%1;g.strokeStyle=`rgba(255,255,255,${(1-p)*0.9})`;g.lineWidth=4;g.beginPath();g.arc(x,650,10+p*30,0,TAU);g.stroke();}}
  const e=t-t0;if(e<3.4){g.globalAlpha=clamp(Math.min(e/0.4,(3.4-e)/0.6),0,1);g.font=`900 32px ${FONT}`;g.lineJoin='round';g.lineWidth=8;g.strokeStyle='rgba(40,70,40,0.6)';g.strokeText('もりのピンボール',200,380);g.fillStyle='#fff6dc';g.fillText('もりのピンボール',200,380);}
  g.restore();}

let last=performance.now(),acc=0;const STEP=1000/120;
function frame(now){let dms=Math.min(50,now-last);last=now;acc+=dms;while(acc>=STEP){Engine.update(engine,STEP);acc-=STEP;}const t=now/1000;update(dms/1000);
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);drawScreenBG(t);
  g.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);drawField(t);drawSegs();bumpers.forEach(drawMushroom);drawSpin();ANI.forEach(a=>drawAnimal(a,t));flips.forEach(drawFlipper);balls.forEach(drawBall);drawParts();drawHUD(t);
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
