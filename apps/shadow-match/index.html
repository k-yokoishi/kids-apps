<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>かげぴったん</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff0d6;--dot:#ffe2b0;--tray:#ffd9a0;--shadow:#5b4a7a;--ink:#5b4a7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2340;--dot:#342b4f;--tray:#3a3057;--shadow:#0f0b1c;--ink:#ffe9c4}}
:root[data-theme="dark"]{--bg:#2a2340;--dot:#342b4f;--tray:#3a3057;--shadow:#0f0b1c;--ink:#ffe9c4}
html{height:100%;background:linear-gradient(var(--bg) 50%,var(--tray) 50%)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>

<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#b8c0ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="かげぴったん">
<link rel="icon" href="../../icons/shadow-match-192.png">
<link rel="apple-touch-icon" href="../../icons/shadow-match-180.png">
</head>
<body>
<canvas id="c" aria-label="かげぴったん。かたちをうごかしてかげにぴったりはめます。さわるとくるっとまわります"></canvas>
<script>
(()=>{
const TAU=Math.PI*2,HP=Math.PI/2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);const ri=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
let W=0,H=0,U=1,C={},u=60,CX=0,CY=0,trayY=0;
function readColors(){const s=getComputedStyle(document.documentElement);['bg','dot','tray','shadow','ink'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}

/* ---------- sound & voice ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=0.95;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.getVoices();}catch(e){}
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5];

/* ---------- shapes (unit = 1) ---------- */
// rotation symmetry: how many distinct quarter turns
const SYM={sq:1,circle:1,rect:2,tri:4,big:4,half:4};
function shapePath(type){g.beginPath();
  if(type==='sq')g.rect(-0.5,-0.5,1,1);
  else if(type==='rect')g.rect(-1,-0.5,2,1);
  else if(type==='tri'){g.moveTo(-0.5,-0.5);g.lineTo(-0.5,0.5);g.lineTo(0.5,0.5);g.closePath();}
  else if(type==='big'){g.moveTo(-1,0.5);g.lineTo(1,0.5);g.lineTo(0,-0.5);g.closePath();}
  else if(type==='circle')g.arc(0,0,0.5,0,TAU);
  else if(type==='half'){g.arc(0,0.25,0.5,Math.PI,TAU);g.closePath();}}
const LEVELS=[
 {name:'おうち',say:'おうち できた！',w:2,h:2,p:[['sq',-0.5,0.5,0,'#ff8a5c'],['sq',0.5,0.5,0,'#ffc53d'],['big',0,-0.5,0,'#ff5d6c']],deco:'house'},
 {name:'さかな',say:'おさかな できた！',w:3,h:2,p:[['circle',-0.5,0.25,0,'#4dabf7'],['big',0.5,0.25,3,'#74c0fc'],['half',-0.5,-0.5,0,'#339af0']],deco:'fish'},
 {name:'ロケット',say:'ロケット できた！ はっしゃ！',w:3,h:3.5,p:[['rect',0,0.25,1,'#e5e7ee'],['half',0,-1,0,'#ff5d6c'],['tri',-1,0.75,3,'#ffc53d'],['tri',1,0.75,0,'#ffc53d']],deco:'rocket'},
 {name:'くるま',say:'くるま できた！ ぶーぶー！',w:3,h:3,p:[['rect',0,0.25,0,'#ff6b6b'],['sq',-0.5,-0.75,0,'#ff8787'],['tri',0.5,-0.75,0,'#a5d8ff'],['circle',-0.5,1.25,0,'#495057'],['circle',0.5,1.25,0,'#495057']],deco:'car'},
 {name:'ねこ',say:'ねこちゃん できた！ にゃーん',w:2.5,h:3,p:[['rect',0,-0.25,0,'#f4a261'],['tri',-0.5,-1.25,0,'#e76f51'],['tri',0.5,-1.25,3,'#e76f51'],['sq',0,0.75,0,'#f4a261'],['half',0.75,0.75,1,'#e76f51']],deco:'cat'},
 {name:'おしろ',say:'おしろ できた！ すごい！',w:3,h:3.5,p:[['rect',-1,0.5,1,'#b197fc'],['rect',1,0.5,1,'#b197fc'],['sq',0,1,0,'#d0bfff'],['half',-1,-0.75,0,'#ff8fb1'],['half',1,-0.75,0,'#ff8fb1'],['tri',0,0,1,'#ffc53d']],deco:'castle'},
];
let lvIdx=0,slots=[],pieces=[],done=false,doneT=0,drag=null,hintT=0,parts=[],moved=false;
function layout(){const L=LEVELS[lvIdx%LEVELS.length];const areaH=H*0.52;u=Math.min((W*0.8)/(L.w+0.6),(areaH*0.85)/(L.h+0.6),130*U);CX=W/2;CY=H*0.08+areaH/2+10*U;trayY=H*0.62;}
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);U=clamp(Math.min(W,H)/560,0.7,1.6);readColors();
  const ou=u;layout();if(slots.length){for(const p of pieces){if(p.placed){const s=p.slot;p.x=CX+s.ux*u;p.y=CY+s.uy*u;}else{p.x=(p.x/(W0||W))*W;p.y=trayY+(p.y-(T0||trayY));}}}W0=W;T0=trayY;}
let W0=0,T0=0;
addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}
function newLevel(){const L=LEVELS[lvIdx%LEVELS.length];layout();done=false;doneT=0;hintT=0;
  slots=L.p.map(([type,ux,uy,rot,col])=>({type,ux,uy,rot,col,filled:false}));
  const n=slots.length;const order=slots.map((s,i)=>i).sort(()=>Math.random()-0.5);
  pieces=order.map((si,k)=>{const s=slots[si];const cols=Math.min(n,W>H?6:3),row=Math.floor(k/cols),col=k%cols,inRow=Math.min(cols,n-row*cols);
    const x=W*(col+0.5)/inRow+rand(-8,8)*U,y=trayY+(H-trayY)*(row+0.5)/Math.ceil(n/cols)+rand(-6,6)*U;
    let rot=s.rot;if(SYM[s.type]>1){rot=(s.rot+1+ri(3))%4;}
    return{type:s.type,col:s.col,x,y,rot,vr:rot*HP,placed:false,slot:null,pop:0,wob:0,home:{x,y}};});
  say(lvIdx===0?'かたちを うごかして かげに ぴったり はめてね':L.name+'の かげだよ');}
const same=(type,a,b)=>((a-b)%SYM[type]+SYM[type])%SYM[type]===0;
function tryPlace(p){let best=null,bd=1e9;for(const s of slots){if(s.filled||s.type!==p.type)continue;const d=Math.hypot(p.x-(CX+s.ux*u),p.y-(CY+s.uy*u));if(d<bd){bd=d;best=s;}}
  if(best&&bd<u*0.55){if(same(p.type,p.rot,best.rot)){best.filled=true;p.placed=true;p.slot=best;p.col=best.col;p.rot=best.rot+Math.round((p.vr/HP-best.rot)/4)*4;p.pop=1;
      const k=slots.filter(s=>s.filled).length;tone(PENTA[k+3],0.35,'triangle',0.16);tone(PENTA[k+3]*2,0.25,'sine',0.06,0.06);
      for(let i=0;i<10;i++){const a=Math.random()*TAU,v=rand(80,180)*U;parts.push({x:CX+best.ux*u,y:CY+best.uy*u,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:0.6,col:'#ffe066',s:rand(3,5)*U});}
      if(slots.every(s=>s.filled)){done=true;doneT=0;const L=LEVELS[lvIdx%LEVELS.length];setTimeout(()=>{say(L.say);[0,2,4,5,7,9,10].forEach((k,i)=>tone(PENTA[k],0.45,'triangle',0.12,i*0.09));
        for(let i=0;i<40;i++){const a=Math.random()*TAU,v=rand(120,300)*U;parts.push({x:CX,y:CY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-100*U,life:0,max:rand(0.9,1.5),col:['#ff8fb1','#ffc53d','#74c0fc','#8ce99a','#b197fc'][i%5],s:rand(4,7)*U});}},350);}
      return true;}
    else{p.wob=1;tone(220,0.15,'triangle',0.1);hintT++;if(hintT%2===1)say('くるっと まわしてみよう');}}
  else tone(330,0.08,'sine',0.06);
  return false;}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function hitPiece(x,y){for(let i=pieces.length-1;i>=0;i--){const p=pieces[i];if(p.placed)continue;const r=(p.type==='rect'||p.type==='big')?u*1.05:u*0.7;if(Math.hypot(x-p.x,y-p.y)<r)return p;}return null;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);
  if(done&&doneT>1.3){const b=nextBtn();if(Math.hypot(x-b.x,y-b.y)<b.r*1.4){lvIdx++;tone(880,0.2,'sine',0.1,0,1320);newLevel();}return;}
  if(drag)return;const p=hitPiece(x,y);if(!p)return;pieces.splice(pieces.indexOf(p),1);pieces.push(p);drag={p,id:e.pointerId,ox:x-p.x,oy:y-p.y,sx:x,sy:y};moved=false;tone(500,0.06,'sine',0.08);});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const[x,y]=pos(e);if(Math.hypot(x-drag.sx,y-drag.sy)>8*U)moved=true;if(moved){drag.p.x=clamp(x-drag.ox,20,W-20);drag.p.y=clamp(y-drag.oy,20,H-20);}});
function up(e){if(!drag||e.pointerId!==drag.id)return;const p=drag.p;drag=null;
  if(!moved){p.rot=(p.rot+1);tone(660,0.1,'triangle',0.1,0,880);return;}
  if(!tryPlace(p)&&p.y<trayY-u*0.8&&Math.hypot(p.x-CX,p.y-CY)>u*2.5){p.x=p.home.x;p.y=p.home.y;}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
function nextBtn(){return{x:W/2,y:trayY+(H-trayY)*0.5,r:38*U};}

/* ---------- drawing ---------- */
function drawBG(){g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.fillStyle=C.dot;const s=34*U;for(let y=s/2;y<trayY;y+=s)for(let x=((y/s|0)%2)*s/2;x<W+s;x+=s){g.beginPath();g.arc(x,y,3*U,0,TAU);g.fill();}
  g.fillStyle=C.tray;g.beginPath();const r=26*U;g.moveTo(0,trayY-u*0.2+r);g.quadraticCurveTo(0,trayY-u*0.2,r,trayY-u*0.2);g.lineTo(W-r,trayY-u*0.2);g.quadraticCurveTo(W,trayY-u*0.2,W,trayY-u*0.2+r);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();}
function drawShape(type,x,y,rot,col,scale=1,stroke){g.save();g.translate(x,y);g.rotate(rot);g.scale(u*scale,u*scale);shapePath(type);g.fillStyle=col;g.fill();if(stroke){g.lineWidth=stroke/(u*scale);g.strokeStyle='rgba(0,0,0,0.15)';g.lineJoin='round';g.stroke();}g.restore();}
function drawShadow(t){for(const s of slots){drawShape(s.type,CX+s.ux*u,CY+s.uy*u,s.rot*HP,C.shadow,1);}
  g.save();g.globalAlpha=0.35;g.setLineDash([5*U,6*U]);for(const s of slots){if(s.filled)continue;g.save();g.translate(CX+s.ux*u,CY+s.uy*u);g.rotate(s.rot*HP);g.scale(u,u);shapePath(s.type);g.restore();g.strokeStyle='#ffffff';g.lineWidth=2*U;g.stroke();}g.restore();}
function drawPiece(p,t){p.vr+=(p.rot*HP-p.vr)*0.25;p.pop=Math.max(0,p.pop-0.04);p.wob=Math.max(0,p.wob-0.03);
  const lift=drag&&drag.p===p?1.08:1;const s=lift*(1+Math.sin(p.pop*Math.PI)*0.12);const w=Math.sin(p.wob*30)*p.wob*0.2;
  if(!p.placed){g.save();g.globalAlpha=0.18;drawShape(p.type,p.x+4*U,p.y+6*U,p.vr+w,'#000',s);g.restore();}
  drawShape(p.type,p.x,p.y,p.vr+w,p.col,s,3*U);
  g.save();g.translate(p.x,p.y);g.rotate(p.vr+w);g.fillStyle='rgba(255,255,255,0.3)';g.beginPath();g.arc(-u*0.18,-u*0.12,u*0.07,0,TAU);g.fill();g.restore();}
function drawDeco(t){if(!done)return;const L=LEVELS[lvIdx%LEVELS.length];const a=clamp(doneT/0.4,0,1);g.save();g.globalAlpha=a;const X=v=>CX+v*u,Y=v=>CY+v*u;
  const eye=(x,y,r)=>{g.fillStyle='#fff';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle='#2b2233';g.beginPath();g.arc(x+r*0.2,y,r*0.55,0,TAU);g.fill();};
  const smile=(x,y,r)=>{g.strokeStyle='#2b2233';g.lineWidth=Math.max(2,r*0.25);g.lineCap='round';g.beginPath();g.arc(x,y,r,0.15*Math.PI,0.85*Math.PI);g.stroke();};
  if(L.deco==='house'){g.fillStyle='#8d5a3b';g.fillRect(X(0.15),Y(0.35),u*0.4,u*0.65);g.fillStyle='#a5d8ff';g.fillRect(X(-0.75),Y(0.3),u*0.45,u*0.4);eye(X(-0.62),Y(0.48),u*0.06);eye(X(-0.42),Y(0.48),u*0.06);}
  if(L.deco==='fish'){const sw=Math.sin(t*4)*u*0.05;eye(X(-0.7),Y(0.15)+sw,u*0.1);smile(X(-0.75),Y(0.35)+sw,u*0.08);for(let i=0;i<3;i++){const p=(t*0.8+i*0.33)%1;g.strokeStyle='rgba(255,255,255,0.8)';g.lineWidth=2;g.beginPath();g.arc(X(-1.2),Y(0)-p*u*1.2,u*0.06+p*u*0.05,0,TAU);g.stroke();}}
  if(L.deco==='rocket'){g.fillStyle='#74c0fc';g.beginPath();g.arc(X(0),Y(0),u*0.22,0,TAU);g.fill();eye(X(-0.08),Y(-0.02),u*0.06);eye(X(0.08),Y(-0.02),u*0.06);for(let i=0;i<3;i++){g.fillStyle=['#ff922b','#ffd43b','#ff6b6b'][i];g.beginPath();g.ellipse(X(0),Y(1.4)+i*u*0.08+Math.sin(t*20+i)*3,u*(0.3-i*0.08),u*(0.3+Math.sin(t*25)*0.06),0,0,TAU);g.fill();}}
  if(L.deco==='car'){g.fillStyle='#e7f5ff';g.fillRect(X(-0.85),Y(-1.1),u*0.7,u*0.5);eye(X(0.7),Y(0.1),u*0.08);g.fillStyle='#ffe066';g.beginPath();g.arc(X(0.95),Y(0.35),u*0.08,0,TAU);g.fill();for(const x of[-0.5,0.5]){g.fillStyle='#dee2e6';g.beginPath();g.arc(X(x),Y(1.25),u*0.18,0,TAU);g.fill();}}
  if(L.deco==='cat'){eye(X(-0.4),Y(-0.3),u*0.1);eye(X(0.4),Y(-0.3),u*0.1);g.fillStyle='#ff8fab';g.beginPath();g.arc(X(0),Y(-0.08),u*0.06,0,TAU);g.fill();smile(X(-0.07),Y(-0.08),u*0.07);smile(X(0.07),Y(-0.08),u*0.07);
    g.strokeStyle='rgba(60,40,40,0.5)';g.lineWidth=1.5;for(const k of[-1,1])for(const j of[-1,1]){g.beginPath();g.moveTo(X(k*0.3),Y(0));g.lineTo(X(k*0.8),Y(j*0.08));g.stroke();}}
  if(L.deco==='castle'){g.fillStyle='#8d5a3b';g.beginPath();g.arc(X(0),Y(1.25),u*0.25,Math.PI,TAU);g.lineTo(X(0.25),Y(1.5));g.lineTo(X(-0.25),Y(1.5));g.fill();for(const x of[-1,1]){g.strokeStyle='#495057';g.lineWidth=2;g.beginPath();g.moveTo(X(x),Y(-1));g.lineTo(X(x),Y(-1.5));g.stroke();g.fillStyle='#ff6b6b';g.beginPath();g.moveTo(X(x),Y(-1.5));g.lineTo(X(x)+u*0.3+Math.sin(t*5)*3,Y(-1.4));g.lineTo(X(x),Y(-1.3));g.fill();}}
  g.restore();
  if(doneT>0.3){const fs=Math.round(30*U);g.save();g.font=`900 ${fs}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=fs*0.22;g.strokeStyle='#fff';g.strokeText(L.name,W/2,H*0.06+fs*0.4);g.fillStyle=C.ink;g.fillText(L.name,W/2,H*0.06+fs*0.4);g.restore();}}
function drawHUD(t){const n=LEVELS.length;for(let i=0;i<n;i++){g.fillStyle=i<lvIdx%n?'#ffc233':i===lvIdx%n?'#ff8fb1':'rgba(120,100,160,0.25)';g.beginPath();g.arc(W/2+(i-(n-1)/2)*16*U,H-14*U,4.5*U,0,TAU);g.fill();}
  if(done&&doneT>1.3){const b=nextBtn();const s=1+Math.sin(t*5)*0.05;g.save();g.translate(b.x,b.y);g.scale(s,s);g.fillStyle='#ff8fb1';g.beginPath();g.arc(0,0,b.r,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(-b.r*0.28,-b.r*0.4);g.lineTo(b.r*0.45,0);g.lineTo(-b.r*0.28,b.r*0.4);g.closePath();g.fill();g.restore();}
  else if(lvIdx===0&&!slots.some(s=>s.filled)&&!drag){const p=pieces.find(q=>!q.placed);if(!p)return;const s=slots.find(q=>q.type===p.type&&!q.filled);const k=(t*0.5)%1,e=Math.min(1,k/0.7);
    const x=p.x+((CX+s.ux*u)-p.x)*e,y=p.y+((CY+s.uy*u)-p.y)*e;g.fillStyle=`rgba(255,255,255,${k<0.85?0.85:0.85*(1-(k-0.85)/0.15)})`;g.strokeStyle='rgba(91,74,122,0.5)';g.lineWidth=3*U;g.beginPath();g.arc(x,y,14*U,0,TAU);g.fill();g.stroke();}}
function drawParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*U*dt;if(p.life>p.max){parts.splice(i,1);continue;}g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=p.col;g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5+p.life*4,r=k%2?p.s*0.45:p.s*1.2;g.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);}g.fill();}g.globalAlpha=1;}

resize();newLevel();W0=W;T0=trayY;
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;if(done)doneT+=dt;g.clearRect(0,0,W,H);drawBG();drawShadow(t);
  pieces.filter(p=>p.placed).forEach(p=>drawPiece(p,t));drawDeco(t);pieces.filter(p=>!p.placed).forEach(p=>drawPiece(p,t));drawParts(dt);drawHUD(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
