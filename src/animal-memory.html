<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>どうぶつ しんけいすいじゃく</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#d7f0e6;--bg2:#c6e8da;--back1:#7c83fd;--back2:#96baff;--face:#ffffff;--ink:#35506b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2b33;--bg2:#22343d;--back1:#5a5fc9;--back2:#6f8fd6;--face:#f4f1ff;--ink:#e8f4ff}}
:root[data-theme="dark"]{--bg:#1c2b33;--bg2:#22343d;--back1:#5a5fc9;--back2:#6f8fd6;--face:#f4f1ff;--ink:#e8f4ff}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c" aria-label="どうぶつしんけいすいじゃく。カードをめくって、おなじどうぶつをさがします"></canvas>
<script>
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let W=0,H=0,U=1,C={};
function readColors(){const s=getComputedStyle(document.documentElement);['bg','bg2','back1','back2','face','ink'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}

/* ---------- sound & voice ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=1;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.getVoices();}catch(e){}
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5];

/* ---------- game ---------- */
const ANIMALS=[['🐶','いぬ'],['🐱','ねこ'],['🐰','うさぎ'],['🐻','くま'],['🐼','パンダ'],['🐸','かえる'],['🐷','ぶた'],['🐵','さる'],['🦁','ライオン'],['🐯','とら'],['🐨','コアラ'],['🐔','にわとり'],['🐘','ぞう'],['🦒','きりん']];
const LEVELS=[3,4,6,8,10];
let lvIdx=0,cards=[],open=[],lock=0,preview=0,won=false,wonT=0,parts=[],found=0;
function newLevel(){const pairs=LEVELS[Math.min(lvIdx,LEVELS.length-1)];const pool=ANIMALS.slice().sort(()=>Math.random()-0.5).slice(0,pairs);
  const deck=[];pool.forEach(a=>{deck.push(a);deck.push(a);});deck.sort(()=>Math.random()-0.5);
  cards=deck.map(([e,n],i)=>({e,n,state:'up',flip:1,bounce:0,shake:0,i}));open=[];won=false;wonT=0;found=0;
  preview=1.5+pairs*0.35;layout();say(lvIdx===0?'どうぶつの ばしょを おぼえてね':'おぼえてね');}
function layout(){const n=cards.length;const land=W>H;let best=null;
  for(let cols=2;cols<=n;cols++){const rows=Math.ceil(n/cols);if(cols*rows!==n&&n%cols!==0&&cols*rows-n>1)continue;const aw=W*0.92,ah=H*0.72;const cw=Math.min(aw/cols,ah/rows*0.78);if(!best||cw>best.cw)best={cols,rows,cw};}
  const{cols,rows,cw}=best;const ch=cw/0.78;const gw=cols*cw,gh=rows*ch;const x0=(W-gw)/2,y0=H*0.16+(H*0.74-gh)/2;
  cards.forEach((c,i)=>{const r=Math.floor(i/cols),k=i%cols;c.x=x0+(k+0.5)*cw;c.y=y0+(r+0.5)*ch;c.w=cw*0.88;c.h=ch*0.9;});}
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);U=clamp(Math.min(W,H)/560,0.7,1.6);readColors();if(cards.length)layout();}
addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}
function tapCard(c){if(preview>0||lock>0||won||c.state!=='down'||open.length>=2)return;c.state='up';open.push(c);tone(520+open.length*120,0.12,'triangle',0.12);say(c.n);
  if(open.length===2){const[a,b]=open;if(a.e===b.e){lock=0.5;setTimeout(()=>{a.state=b.state='matched';a.bounce=b.bounce=1;open=[];found++;say('おなじ！ '+a.n+'！');[0,2,4].forEach((k,i)=>tone(PENTA[k+4+found%3],0.3,'triangle',0.12,i*0.08));
      for(const q of[a,b])for(let i=0;i<10;i++){const an=Math.random()*TAU,v=rand(80,180)*U;parts.push({x:q.x,y:q.y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-60*U,life:0,max:0.8,col:['#ffc233','#ff8fb1','#74c0fc'][i%3],s:rand(3,5)*U});}
      if(cards.every(q=>q.state==='matched')){won=true;wonT=0;setTimeout(()=>{say('ぜんぶ みつけたね！ すごい！');[0,2,4,5,7,9,10].forEach((k,i)=>tone(PENTA[k],0.45,'triangle',0.12,i*0.09));},700);}},380);}
    else{lock=1.3;setTimeout(()=>{a.shake=b.shake=1;tone(220,0.2,'triangle',0.1);},700);setTimeout(()=>{a.state=b.state='down';open=[];tone(330,0.1,'sine',0.06);},1200);}}}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function nextBtn(){return{x:W/2,y:H-52*U,r:36*U};}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);
  if(won&&wonT>1.6){const b=nextBtn();if(Math.hypot(x-b.x,y-b.y)<b.r*1.5){lvIdx++;tone(880,0.2,'sine',0.1,0,1320);newLevel();}return;}
  if(preview>0){preview=Math.min(preview,0.3);return;}
  for(const c of cards)if(Math.abs(x-c.x)<c.w/2&&Math.abs(y-c.y)<c.h/2){tapCard(c);return;}});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function paw(x,y,s){g.beginPath();g.ellipse(x,y+s*0.25,s*0.45,s*0.38,0,0,TAU);g.fill();for(const[dx,dy]of[[-0.45,-0.25],[-0.16,-0.52],[0.16,-0.52],[0.45,-0.25]]){g.beginPath();g.ellipse(x+dx*s,y+dy*s,s*0.16,s*0.2,0,0,TAU);g.fill();}}
function drawBG(t){g.fillStyle=C.bg;g.fillRect(0,0,W,H);g.fillStyle=C.bg2;const s=60*U;for(let y=0;y<H+s;y+=s)for(let x=((y/s|0)%2)*s/2;x<W+s;x+=s)paw(x,y,9*U);}
function drawCard(c,t,dt){const target=c.state==='down'&&preview<=0?0:1;c.flip+=(target-c.flip)*Math.min(1,dt*10);c.bounce=Math.max(0,c.bounce-dt*1.5);c.shake=Math.max(0,c.shake-dt*2.5);
  const sx=Math.cos((1-c.flip)*Math.PI);const face=sx>=0;const hop=Math.sin(c.bounce*Math.PI*2)*c.bounce*8*U+(won?Math.abs(Math.sin(t*6-c.i*0.4))*6*U:0);const shk=Math.sin(c.shake*25)*c.shake*6*U;
  g.save();g.translate(c.x+shk,c.y-hop);g.scale(Math.max(0.02,Math.abs(sx)),1);const w=c.w,h=c.h,r=w*0.14;
  g.fillStyle='rgba(0,0,0,0.12)';rr(-w/2+3*U,-h/2+5*U,w,h,r);g.fill();
  if(face){rr(-w/2,-h/2,w,h,r);g.fillStyle=c.state==='matched'?'#fff6d6':C.face;g.fill();if(c.state==='matched'){g.strokeStyle='#ffc233';g.lineWidth=4*U;g.stroke();}
    g.font=`${Math.round(w*0.62)}px ${EMO}`;g.textAlign='center';g.textBaseline='middle';g.fillText(c.e,0,-h*0.06);
    g.font=`900 ${Math.round(w*0.15)}px ${FONT}`;g.fillStyle='#6b5a7a';g.fillText(c.n,0,h*0.33);}
  else{rr(-w/2,-h/2,w,h,r);const gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,C.back2);gr.addColorStop(1,C.back1);g.fillStyle=gr;g.fill();g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=3*U;rr(-w/2+w*0.08,-h/2+w*0.08,w*0.84,h-w*0.16,r*0.7);g.stroke();
    g.fillStyle='rgba(255,255,255,0.85)';g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?w*0.1:w*0.22;g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}g.fill();}
  g.restore();}
function drawUI(t){const fs=Math.round(20*U);g.font=`900 ${fs}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=C.ink;
  const title=preview>0?'おぼえてね…':won?'ぜんぶ みつけた！':'おなじ どうぶつ どれかな？';g.fillText(title,W/2,H*0.07);
  if(preview>0){const k=preview/(1.5+LEVELS[Math.min(lvIdx,LEVELS.length-1)]*0.35);g.fillStyle='rgba(255,255,255,0.7)';rr(W*0.3,H*0.07+18*U,W*0.4,8*U,4*U);g.fill();g.fillStyle='#ff8fb1';rr(W*0.3,H*0.07+18*U,W*0.4*k,8*U,4*U);g.fill();}
  const n=LEVELS.length;for(let i=0;i<n;i++){g.fillStyle=i<lvIdx?'#ffc233':i===Math.min(lvIdx,n-1)?'#ff8fb1':'rgba(60,80,110,0.25)';g.beginPath();g.arc(W/2+(i-(n-1)/2)*15*U,H-14*U,4.5*U,0,TAU);g.fill();}
  if(won&&wonT>1.6){const b=nextBtn();const s=1+Math.sin(t*5)*0.05;g.save();g.translate(b.x,b.y);g.scale(s,s);g.fillStyle='#ff8fb1';g.beginPath();g.arc(0,0,b.r,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(-b.r*0.28,-b.r*0.4);g.lineTo(b.r*0.45,0);g.lineTo(-b.r*0.28,b.r*0.4);g.closePath();g.fill();g.restore();}}
function drawParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*U*dt;if(p.life>p.max){parts.splice(i,1);continue;}g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=p.col;g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5+p.life*4,r=k%2?p.s*0.45:p.s*1.2;g.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);}g.fill();}g.globalAlpha=1;}

resize();newLevel();
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  if(preview>0){preview-=dt;if(preview<=0){for(const c of cards)c.state='down';tone(440,0.15,'sine',0.1,0,300);say('どこかな？');}}
  lock=Math.max(0,lock-dt);if(won)wonT+=dt;
  g.clearRect(0,0,W,H);drawBG(t);cards.forEach(c=>drawCard(c,t,dt));drawParts(dt);drawUI(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
