<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ぐるぐる すいぞくかん</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sea-top:#6fd6f2;--sea-bottom:#2a7fc9;--sand:#f7d9a0;--sand-dark:#e8c07c;--weed:#3fbf8a;--ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea-top:#1d4f86;--sea-bottom:#0b1f45;--sand:#8a7350;--sand-dark:#735e40;--weed:#2a8a66;--ink:#e8f6ff}}
:root[data-theme="dark"]{--sea-top:#1d4f86;--sea-bottom:#0b1f45;--sand:#8a7350;--sand-dark:#735e40;--weed:#2a8a66;--ink:#e8f6ff}
html{height:100%;background:linear-gradient(var(--sea-top) 50%,var(--sand) 50%)}
body{height:100%;margin:0;overflow:hidden;background:var(--sea-top);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c" aria-label="ぐるぐるすいぞくかん。ゆびでぐるっとまるをかくと、さかなになっておよぎます"></canvas>
<script>
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5];

let W=0,H=0,U=1,C={},sandY=0,made=false,seq=0,weeds=[];
const strokes=new Map(),fading=[],fish=[],sparks=[],bubbles=[];
function readColors(){const s=getComputedStyle(document.documentElement);['sea-top','sea-bottom','sand','sand-dark','weed','ink'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);
  U=clamp(Math.min(W,H)/560,0.7,1.6);sandY=H*0.88;weeds=[];const n=Math.max(4,Math.round(W/90));for(let i=0;i<n;i++)weeds.push({x:(i+rand(0.2,0.8))/n*W,h:rand(0.12,0.28)*H,ph:Math.random()*TAU,w:rand(8,14)});readColors();}
addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}

/* ---------- sound & voice ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=0.95;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.getVoices();}catch(e){}
let drawNoteT=0;

/* ---------- creatures ---------- */
function resample(pts,n){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);seg.push(d);L+=d;}
  const out=[];let acc=0,j=0;for(let k=0;k<n;k++){const target=k/n*L;while(j<seg.length-1&&acc+seg[j]<target){acc+=seg[j];j++;}const f=seg[j]?(target-acc)/seg[j]:0;const a=pts[j],b=pts[j+1]||a;out.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f});}return out;}
function makeFish(s){const pts=resample(s.pts,48);let cx=0,cy=0;pts.forEach(p=>{cx+=p.x;cy+=p.y});cx/=pts.length;cy/=pts.length;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const bw=maxX-minX,bh=maxY-minY,big=Math.max(bw,bh);const maxD=Math.min(W,H)*0.4,minD=70*U;const sc=big>maxD?maxD/big:big<minD?minD/big:1;
  const rel=pts.map(p=>({x:(p.x-cx)*sc,y:(p.y-cy)*sc}));const hue=(s.hue+s.len*0.25)%360;
  const f={id:seq++,x:cx,y:cy,rel,bw:bw*sc,bh:bh*sc,hue,dir:Math.random()<0.5?1:-1,face:1,vx:0,vy:0,ph:Math.random()*TAU,born:0,joy:1,sp:rand(28,55)*U,turnT:rand(4,9)};f.face=f.dir;
  fish.push(f);if(fish.length>8){const o=fish.shift();for(let k=0;k<8;k++)bubbles.push({x:o.x+rand(-20,20)*U,y:o.y+rand(-20,20)*U,r:rand(3,8)*U,vy:-rand(40,90)*U,ph:Math.random()*TAU});}
  made=true;[0,2,4,7].forEach((k,i)=>tone(PENTA[k+2],0.4,'triangle',0.13,i*0.08));say(['できた！','こんにちは！','およぐよ！','やったね！'][Math.floor(Math.random()*4)]);
  for(let k=0;k<14;k++){const a=Math.random()*TAU,v=rand(80,200)*U;sparks.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rand(0.5,0.9),hue,s:rand(3,6)*U});}}
function finishStroke(s){const n=s.pts.length;if(n<2)return;const a=s.pts[0],b=s.pts[n-1];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;s.pts.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);});
  const big=Math.max(maxX-minX,maxY-minY),small=Math.min(maxX-minX,maxY-minY);const gap=Math.hypot(a.x-b.x,a.y-b.y);
  if(s.len>140*U&&small>30*U&&gap<Math.max(55*U,big*0.45)){makeFish(s);return;}
  fading.push({s,life:0});for(let i=0;i<n;i+=3){const p=s.pts[i];sparks.push({x:p.x,y:p.y,vx:rand(-30,30)*U,vy:rand(-60,-10)*U,life:0,max:rand(0.5,1),hue:(s.hue+i*2)%360,s:rand(2,4)*U});}
  tone(1200,0.3,'sine',0.05,0,1800);}
function tapAt(x,y){for(let i=fish.length-1;i>=0;i--){const f=fish[i];if(Math.hypot(x-f.x,y-f.y)<Math.max(f.bw,f.bh)*0.55+10*U){f.joy=1;f.vy-=120*U;const n=PENTA[Math.floor(clamp((1-f.y/H),0,0.99)*PENTA.length)];tone(n,0.4,'triangle',0.18);tone(n*1.5,0.3,'sine',0.07,0.08);
      for(let k=0;k<5;k++)bubbles.push({x:f.x+rand(-10,10)*U,y:f.y-f.bh*0.3,r:rand(3,7)*U,vy:-rand(50,100)*U,ph:Math.random()*TAU});return;}}
  for(let k=0;k<4;k++)bubbles.push({x:x+rand(-8,8)*U,y,r:rand(3,9)*U,vy:-rand(50,110)*U,ph:Math.random()*TAU});tone(rand(500,800),0.12,'sine',0.08,0,rand(900,1200));}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);strokes.set(e.pointerId,{pts:[{x,y}],len:0,hue:Math.random()*360});});
cv.addEventListener('pointermove',e=>{const s=strokes.get(e.pointerId);if(!s)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const[x,y]=pos(ev);const l=s.pts[s.pts.length-1];const d=Math.hypot(x-l.x,y-l.y);if(d<3)continue;s.pts.push({x,y});s.len+=d;
  if(s.pts.length%3===0)sparks.push({x,y,vx:rand(-20,20)*U,vy:rand(-40,0)*U,life:0,max:0.5,hue:(s.hue+s.len*0.5)%360,s:rand(2,3.5)*U});}
  drawNoteT+=1;if(drawNoteT%6===0){const l=s.pts[s.pts.length-1];tone(PENTA[Math.floor(clamp(1-l.y/H,0,0.99)*PENTA.length)]*2,0.12,'sine',0.035);}});
function end(e){const s=strokes.get(e.pointerId);strokes.delete(e.pointerId);if(!s)return;if(s.len<20*U){const p=s.pts[0];tapAt(p.x,p.y);}else finishStroke(s);}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- update ---------- */
let ambT=0;
function update(dt,t){
  for(const f of fish){f.born+=dt;f.joy=Math.max(0,f.joy-dt*0.9);f.turnT-=dt;
    const m=Math.max(f.bw,f.bh)*0.5;if(f.turnT<0){f.dir*=-1;f.turnT=rand(5,10);}
    if(f.x<m&&f.dir<0)f.dir=1;if(f.x>W-m&&f.dir>0)f.dir=-1;
    f.face+=(f.dir-f.face)*Math.min(1,dt*4);
    const tvx=f.dir*f.sp*(1+f.joy);f.vx+=(tvx-f.vx)*dt*1.5;f.vy+=(Math.sin(t*0.8+f.ph)*20*U-f.vy)*dt*1.2;f.x+=f.vx*dt;f.y+=f.vy*dt;
    const top=f.bh*0.5+H*0.05,bot=sandY-f.bh*0.5;if(f.y<top){f.y=top;f.vy=Math.abs(f.vy);}if(f.y>bot){f.y=bot;f.vy=-Math.abs(f.vy);}
    if(Math.random()<dt*0.4)bubbles.push({x:f.x+f.dir*f.bw*0.5,y:f.y,r:rand(2,5)*U,vy:-rand(40,70)*U,ph:Math.random()*TAU});}
  ambT-=dt;if(ambT<0){ambT=rand(0.4,1);bubbles.push({x:rand(0,W),y:sandY,r:rand(2,6)*U,vy:-rand(30,60)*U,ph:Math.random()*TAU});}
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y+=b.vy*dt;b.x+=Math.sin(t*3+b.ph)*10*U*dt;if(b.y<-10)bubbles.splice(i,1);}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*U*dt;if(p.life>p.max)sparks.splice(i,1);}
  for(let i=fading.length-1;i>=0;i--){fading[i].life+=dt;if(fading[i].life>0.6)fading.splice(i,1);}}

/* ---------- draw ---------- */
function drawBG(t){const gr=g.createLinearGradient(0,0,0,sandY);gr.addColorStop(0,C['sea-top']);gr.addColorStop(1,C['sea-bottom']);g.fillStyle=gr;g.fillRect(0,0,W,sandY+2);
  g.save();g.globalAlpha=0.08;g.fillStyle='#ffffff';for(let i=0;i<4;i++){const x=W*(0.15+i*0.25)+Math.sin(t*0.3+i)*30*U;g.beginPath();g.moveTo(x-20*U,0);g.lineTo(x+40*U,0);g.lineTo(x+120*U,sandY);g.lineTo(x+40*U,sandY);g.closePath();g.fill();}g.restore();
  for(const w of weeds){g.strokeStyle=C.weed;g.lineWidth=w.w*U;g.lineCap='round';g.beginPath();g.moveTo(w.x,sandY+4);const sw=Math.sin(t*1.2+w.ph)*20*U;g.bezierCurveTo(w.x+sw,sandY-w.h*0.35,w.x-sw,sandY-w.h*0.7,w.x+sw*0.8,sandY-w.h);g.stroke();}
  g.fillStyle=C.sand;g.beginPath();g.moveTo(0,H);g.lineTo(0,sandY);for(let x=0;x<=W+20;x+=20)g.lineTo(x,sandY+Math.sin(x/W*TAU*2)*5*U);g.lineTo(W+20,H);g.closePath();g.fill();
  g.fillStyle=C['sand-dark'];for(let i=0;i<W/40;i++){g.beginPath();g.arc((i*97)%W,sandY+((i*37)%100)/100*(H-sandY-6)+6,2*U,0,TAU);g.fill();}}
function drawStroke(s,alpha){const p=s.pts;g.lineCap='round';g.lineJoin='round';g.lineWidth=11*U;let L=0;
  for(let i=1;i<p.length;i++){L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);g.strokeStyle=`hsla(${(s.hue+L*0.5)%360},90%,62%,${alpha})`;g.beginPath();g.moveTo(p[i-1].x,p[i-1].y);g.lineTo(p[i].x,p[i].y);g.stroke();}
  if(p.length===1){g.fillStyle=`hsla(${s.hue},90%,62%,${alpha})`;g.beginPath();g.arc(p[0].x,p[0].y,6*U,0,TAU);g.fill();}}
function drawFish(f,t){const e=easeOutBack(clamp(f.born/0.5,0,1));const sq=Math.sin(t*6+f.ph)*0.04+f.joy*Math.sin(t*20)*0.08;
  g.save();g.translate(f.x,f.y);g.scale(f.face*e*(1+sq),e*(1-sq));
  const fill=`hsl(${f.hue},85%,72%)`,edge=`hsl(${f.hue},65%,45%)`;
  // tail at the back (left side when facing right)
  let minX=0;for(const p of f.rel)minX=Math.min(minX,p.x);const T=clamp(Math.min(f.bw,f.bh)*0.38,14*U,60*U);const wag=Math.sin(t*8+f.ph)*0.35;
  g.save();g.translate(minX+T*0.25,0);g.rotate(wag);g.fillStyle=`hsl(${(f.hue+30)%360},85%,66%)`;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-T*0.6,-T*0.2,-T,-T*0.75);g.quadraticCurveTo(-T*0.7,0,-T,T*0.75);g.quadraticCurveTo(-T*0.6,T*0.2,0,0);g.fill();g.restore();
  // body wobbles like jelly
  g.beginPath();f.rel.forEach((p,i)=>{const w=1+Math.sin(i*0.8+t*4+f.ph)*0.03;i?g.lineTo(p.x*w,p.y*w):g.moveTo(p.x*w,p.y*w);});g.closePath();g.fillStyle=fill;g.fill();g.lineWidth=4*U;g.strokeStyle=edge;g.stroke();
  // stripes pattern (clipped)
  g.save();g.clip();g.fillStyle=`hsla(${(f.hue+50)%360},90%,85%,0.55)`;for(let k=-2;k<=2;k++){g.beginPath();g.ellipse(k*f.bw*0.22,0,f.bw*0.04+3*U,f.bh,0,0,TAU);g.fill();}g.restore();
  // face (towards the front = +x)
  const er=clamp(Math.min(f.bw,f.bh)*0.1,5*U,18*U);const fx=f.bw*0.18,fy=-f.bh*0.08;
  g.fillStyle='rgba(255,120,150,0.45)';g.beginPath();g.arc(fx+er*1.9,fy+er*1.6,er*0.5,0,TAU);g.fill();g.beginPath();g.arc(fx-er*1.4,fy+er*1.6,er*0.5,0,TAU);g.fill();
  for(const dx of[-er*1.1,er*1.3]){if(f.joy>0.4){g.strokeStyle='#2b2233';g.lineWidth=Math.max(2,er*0.35);g.lineCap='round';g.beginPath();g.arc(fx+dx,fy,er*0.7,Math.PI*1.15,Math.PI*1.85);g.stroke();}
    else{g.fillStyle='#fff';g.beginPath();g.arc(fx+dx,fy,er,0,TAU);g.fill();g.fillStyle='#2b2233';g.beginPath();g.arc(fx+dx+er*0.3,fy,er*0.55,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(fx+dx+er*0.1,fy-er*0.25,er*0.18,0,TAU);g.fill();}}
  g.strokeStyle='#2b2233';g.lineWidth=Math.max(2,er*0.3);g.beginPath();g.arc(fx+er*0.1,fy+er*1.4,er*0.6,0.15*Math.PI,0.85*Math.PI);g.stroke();
  g.restore();}
function drawFx(t){for(const b of bubbles){g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=1.5*U;g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.stroke();g.fillStyle='rgba(255,255,255,0.6)';g.beginPath();g.arc(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.25,0,TAU);g.fill();}
  for(const p of sparks){g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=`hsl(${p.hue},95%,75%)`;g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4+p.life*3,r=i%2?p.s*0.4:p.s*1.5;g.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r);}g.closePath();g.fill();}g.globalAlpha=1;}
const t0=performance.now()/1000;
function drawOverlay(t){const e=t-t0;if(e<3.4){const a=clamp(Math.min(e/0.4,(3.4-e)/0.6),0,1);const fs=Math.round(30*U);g.save();g.globalAlpha=a;g.font=`900 ${fs}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=C.ink;g.fillText('ぐるぐる すいぞくかん',W/2,H*0.1);g.restore();}
  if(!made&&strokes.size===0){const R=Math.min(W,H)*0.14,cx=W/2,cy=H*0.45;const p=(t*0.5)%1;const k=Math.min(1,p/0.75);
    g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=8*U;g.lineCap='round';g.setLineDash([2*U,16*U]);g.beginPath();g.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+TAU);g.stroke();g.setLineDash([]);
    const a=-Math.PI/2+k*TAU;g.fillStyle=`rgba(255,255,255,${p<0.85?0.9:0.9*(1-(p-0.85)/0.15)})`;g.beginPath();g.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,14*U,0,TAU);g.fill();}}

resize();
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;update(dt,t);g.clearRect(0,0,W,H);drawBG(t);
  for(const f of fish)drawFish(f,t);for(const fd of fading)drawStroke(fd.s,1-fd.life/0.6);for(const[,s]of strokes)drawStroke(s,1);drawFx(t);drawOverlay(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
