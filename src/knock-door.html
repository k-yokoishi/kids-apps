<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>トントン だれかな？</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sky:#9fdcff;--wall:#ffcfd8;--wall-line:#f7b9c6;--roof:#ff7f8f;--ink:#4a3350;--inside:#3a2f4a;--lamp:#ffcf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#2c2f6e;--wall:#9a6f86;--wall-line:#8a6178;--roof:#c4546a;--ink:#fff1f5;--inside:#221a2e;--lamp:#ffd98f}}
:root[data-theme="dark"]{--sky:#2c2f6e;--wall:#9a6f86;--wall-line:#8a6178;--roof:#c4546a;--ink:#fff1f5;--inside:#221a2e;--lamp:#ffd98f}
html{height:100%;background:linear-gradient(var(--sky) 50%,var(--wall) 50%)}
body{height:100%;margin:0;overflow:hidden;background:var(--wall);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c" aria-label="トントン だれかな。ドアをさわるとどうぶつがでてきます"></canvas>
<script>
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';

const ANIMALS=[
 {n:'ねこ',say:'にゃーお！ ねこだよ',h:'#f4a261',ear:'tri',earIn:'#ffc9a8',m:'#fff1e0',nose:'#e76f51',whisk:1,snd:[[760,980],[980,620]]},
 {n:'いぬ',say:'わんわん！ いぬだよ',h:'#d39a66',ear:'droop',earC:'#8d5a3b',m:'#f6e2c9',nose:'#3b2a20',snd:[[300,420],[300,420]]},
 {n:'うさぎ',say:'ぴょんぴょん！ うさぎだよ',h:'#f7f4f8',ear:'long',earIn:'#ffb6c8',m:'#ffffff',nose:'#ff8fab',snd:[[900,1400],[1100,1600]]},
 {n:'くま',say:'のっしのっし！ くまだよ',h:'#8d5a3b',ear:'round',earIn:'#c49070',m:'#dcb28e',nose:'#3b2a20',snd:[[150,120],[130,100]]},
 {n:'ぶた',say:'ぶーぶー！ ぶただよ',h:'#ffb5c5',ear:'tri',earIn:'#ff8fab',pig:1,snd:[[180,140],[200,150]]},
 {n:'かえる',say:'けろけろ！ かえるだよ',h:'#7ccf6a',ear:'frog',snd:[[400,250],[420,260]]},
 {n:'ひよこ',say:'ぴよぴよ！ ひよこだよ',h:'#ffe066',ear:'none',chick:1,snd:[[1500,2100],[1500,2100]]},
 {n:'パンダ',say:'もぐもぐ！ パンダだよ',h:'#fbfbfb',ear:'round',earC:'#2a2a2a',earIn:'#2a2a2a',panda:1,m:'#ffffff',nose:'#2a2a2a',snd:[[500,700],[600,450]]},
 {n:'ねずみ',say:'ちゅーちゅー！ ねずみだよ',h:'#bcbccc',ear:'big',earIn:'#ffc0cb',m:'#e6e6ef',nose:'#ff8fab',whisk:1,snd:[[1800,2300],[1900,2400]]},
 {n:'ライオン',say:'がおー！ ライオンだよ',h:'#f6c453',ear:'round',earIn:'#e0a030',mane:'#d9822b',m:'#fff1c9',nose:'#6b3e1f',snd:[[200,90],[160,80]]},
];
const DOORC=['#ff8a5c','#5cb8ff','#8fd16a','#b48cff','#ffc53d','#ff6fa8'];

let W=0,H=0,U=1,C={},doors=[],opened=false,wiggleT=2;
const parts=[];
function readColors(){const s=getComputedStyle(document.documentElement);['sky','wall','wall-line','roof','ink','inside','lamp'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);
  U=clamp(Math.min(W,H)/560,0.7,1.6);const cols=W>H?3:2,rows=6/cols;const top=H*0.17,bot=H*0.97,cw=W/cols,ch=(bot-top)/rows;
  const old=doors;doors=[];for(let i=0;i<6;i++){const c=i%cols,r=Math.floor(i/cols);const dw=Math.min(cw*0.66,ch*0.62),dh=Math.min(ch*0.84,dw*1.45);
    const o=old[i]||{state:'closed',open:0,timer:0,animal:null,pop:0,joy:0,wig:0,col:DOORC[i]};Object.assign(o,{x:c*cw+cw/2-dw/2,y:top+r*ch+(ch-dh)*0.55,w:dw,h:dh});doors.push(o);}
  readColors();}
addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}

/* ---------- sound & voice ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=0.95;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.getVoices();}catch(e){}
function knock(){tone(170,0.09,'triangle',0.35,0,90);tone(170,0.09,'triangle',0.35,0.16,90);}
function animalSound(a,delay=0){a.snd.forEach(([f1,f2],i)=>tone(f1,0.22,'triangle',0.13,delay+i*0.22,f2));}

/* ---------- animal drawing ---------- */
function ell(x,y,rx,ry,col,rot=0){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,TAU);g.fill();}
function drawAnimal(a,s,t,happy,talk){
  g.lineCap='round';
  if(a.mane){g.fillStyle=a.mane;g.beginPath();for(let i=0;i<=24;i++){const an=i/24*TAU,r=s*(i%2?1.2:1.42);g.lineTo(Math.cos(an)*r,Math.sin(an)*r);}g.fill();}
  // paws on the sill
  for(const sx of[-1,1])ell(sx*s*0.55,s*1.05,s*0.28,s*0.2,a.h);
  const earC=a.earC||a.h;
  if(a.ear==='tri')for(const sx of[-1,1]){g.fillStyle=earC;g.beginPath();g.moveTo(sx*s*0.9,-s*0.25);g.lineTo(sx*s*0.72,-s*1.15);g.lineTo(sx*s*0.2,-s*0.8);g.fill();g.fillStyle=a.earIn;g.beginPath();g.moveTo(sx*s*0.75,-s*0.4);g.lineTo(sx*s*0.68,-s*0.95);g.lineTo(sx*s*0.35,-s*0.75);g.fill();}
  if(a.ear==='round')for(const sx of[-1,1]){ell(sx*s*0.68,-s*0.72,s*0.32,s*0.32,earC);ell(sx*s*0.68,-s*0.72,s*0.17,s*0.17,a.earIn);}
  if(a.ear==='big')for(const sx of[-1,1]){ell(sx*s*0.78,-s*0.72,s*0.5,s*0.5,earC);ell(sx*s*0.78,-s*0.72,s*0.32,s*0.32,a.earIn);}
  if(a.ear==='long')for(const sx of[-1,1]){const w=Math.sin(t*3+sx)*0.08;ell(sx*s*0.36,-s*1.35,s*0.22,s*0.68,a.h,sx*0.12+w);ell(sx*s*0.36,-s*1.32,s*0.11,s*0.5,a.earIn,sx*0.12+w);}
  if(a.ear==='frog')for(const sx of[-1,1])ell(sx*s*0.5,-s*0.7,s*0.38,s*0.36,a.h);
  // head
  if(a.ear==='frog')ell(0,0,s*1.12,s*0.88,a.h);else ell(0,0,s,s,a.h);
  if(a.h==='#f7f4f8'||a.h==='#fbfbfb'){g.strokeStyle='rgba(0,0,0,0.1)';g.lineWidth=2;g.beginPath();g.arc(0,0,s,0,TAU);g.stroke();}
  if(a.ear==='droop')for(const sx of[-1,1])ell(sx*s*0.92,-s*0.05,s*0.28,s*0.6,earC,sx*-0.35);
  if(a.panda)for(const sx of[-1,1])ell(sx*s*0.36,-s*0.08,s*0.22,s*0.28,'#2a2a2a',sx*0.5);
  if(a.m)ell(0,s*0.35,s*0.44,s*0.32,a.m);
  // cheeks
  for(const sx of[-1,1])ell(sx*s*0.62,s*0.25,s*0.13,s*0.09,'rgba(255,110,140,0.4)');
  // eyes
  const ec=a.panda?'#ffffff':'#2b2233';
  for(const sx of[-1,1]){let ex=sx*s*0.36,ey=-s*0.1,er=s*0.11;
    if(a.ear==='frog'){ex=sx*s*0.5;ey=-s*0.72;ell(ex,ey,s*0.24,s*0.24,'#fff');er=s*0.12;}
    if(happy){g.strokeStyle=ec;g.lineWidth=Math.max(2,s*0.07);g.beginPath();g.arc(ex,ey+er*0.3,er*0.9,Math.PI*1.15,Math.PI*1.85);g.stroke();}
    else{ell(ex,ey,er,er*1.1,ec);ell(ex-er*0.3,ey-er*0.35,er*0.35,er*0.35,a.panda?'#2a2a2a':'#fff');}}
  // nose & mouth
  if(a.pig){ell(0,s*0.3,s*0.34,s*0.24,'#ff8fab');ell(-s*0.11,s*0.3,s*0.06,s*0.09,'#c9546f');ell(s*0.11,s*0.3,s*0.06,s*0.09,'#c9546f');}
  else if(a.chick){g.fillStyle='#ff9f1c';g.beginPath();g.moveTo(-s*0.2,s*0.2);g.lineTo(s*0.2,s*0.2);g.lineTo(0,s*(0.45+(talk?0.12:0)));g.fill();}
  else if(a.nose)ell(0,s*0.2,s*0.12,s*0.08,a.nose);
  if(!a.chick){const my=a.pig?s*0.62:s*0.38;g.strokeStyle='#2b2233';g.lineWidth=Math.max(2,s*0.05);
    if(talk){ell(0,my+s*0.04,s*0.13,s*0.13*(0.6+0.4*Math.abs(Math.sin(t*14))),'#7a2e3b');}
    else{g.beginPath();g.arc(-s*0.1,my-s*0.06,s*0.1,0.1*Math.PI,0.9*Math.PI);g.arc(s*0.1,my-s*0.06,s*0.1,0.1*Math.PI,0.9*Math.PI);g.stroke();}}
  if(a.whisk){g.strokeStyle='rgba(60,40,40,0.5)';g.lineWidth=1.5;for(const sx of[-1,1])for(const k of[-1,1]){g.beginPath();g.moveTo(sx*s*0.45,s*0.3);g.lineTo(sx*s*0.95,s*(0.25+k*0.12));g.stroke();}}
}

/* ---------- doors ---------- */
function arch(x,y,w,h){const r=w/2;g.beginPath();g.moveTo(x,y+h);g.lineTo(x,y+r);g.arc(x+r,y+r,r,Math.PI,TAU);g.lineTo(x+w,y+h);g.closePath();}
function pickAnimal(){const used=doors.map(d=>d.animal).filter(Boolean);const pool=ANIMALS.filter(a=>!used.includes(a));return pool[Math.floor(Math.random()*pool.length)];}
function tapDoor(d){opened=true;
  if(d.state==='closed'){knock();d.state='knock';d.timer=0.45;d.wig=1;d.animal=pickAnimal();}
  else if(d.state==='open'||d.state==='opening'){d.joy=1;d.pop=0.6;d.timer=6;say(d.animal.say);animalSound(d.animal);burst(d.x+d.w/2,d.y+d.h*0.45,6);}}
function burst(x,y,n){const cols=['#ff6fa8','#ffc53d','#5cb8ff','#8fd16a','#b48cff'];for(let i=0;i<n;i++){const a=rand(-Math.PI*0.9,-Math.PI*0.1),v=rand(120,240)*U;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rand(0.8,1.2),col:cols[i%5],s:rand(5,8)*U,heart:Math.random()<0.5});}}
function heartPath(x,y,s){g.beginPath();g.moveTo(x,y+s*0.6);g.bezierCurveTo(x-s*1.2,y-s*0.2,x-s*0.5,y-s*1.1,x,y-s*0.35);g.bezierCurveTo(x+s*0.5,y-s*1.1,x+s*1.2,y-s*0.2,x,y+s*0.6);g.closePath();}

function update(dt){
  for(const d of doors){d.wig=Math.max(0,d.wig-dt*2);d.joy=Math.max(0,d.joy-dt*0.8);d.pop=Math.max(0,d.pop-dt*2);
    if(d.state==='knock'){d.timer-=dt;if(d.timer<=0){d.state='opening';tone(520,0.25,'sine',0.08,0,780);}}
    else if(d.state==='opening'){d.open=Math.min(1,d.open+dt/0.35);if(d.open>=1){d.state='open';d.timer=6;d.pop=1;d.talk=1.6;say(d.animal.say);animalSound(d.animal,0.05);burst(d.x+d.w/2,d.y+d.h*0.45,8);}}
    else if(d.state==='open'){d.timer-=dt;if(d.timer<=0){d.state='closing';}}
    else if(d.state==='closing'){d.open=Math.max(0,d.open-dt/0.4);if(d.open<=0){d.state='closed';d.animal=null;tone(200,0.1,'triangle',0.15,0,120);}}
    d.talk=Math.max(0,(d.talk||0)-dt);}
  wiggleT-=dt;if(wiggleT<0){wiggleT=rand(2,4);const cl=doors.filter(d=>d.state==='closed');if(cl.length){cl[Math.floor(Math.random()*cl.length)].wig=0.7;}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.vy+=380*U*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life>p.max)parts.splice(i,1);}}

function drawBG(t){g.fillStyle=C.sky;g.fillRect(0,0,W,H);
  const roofY=H*0.13;g.fillStyle=C.roof;g.beginPath();g.moveTo(-10,roofY+10*U);g.lineTo(W/2,H*0.015);g.lineTo(W+10,roofY+10*U);g.closePath();g.fill();
  g.fillStyle=C.wall;g.fillRect(0,roofY,W,H-roofY);
  g.strokeStyle=C['wall-line'];g.lineWidth=2*U;const bh=26*U;for(let y=roofY+bh,r=0;y<H;y+=bh,r++){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();for(let x=(r%2)*bh;x<W;x+=bh*2){g.beginPath();g.moveTo(x,y-bh);g.lineTo(x,y);g.stroke();}}
  // little round window in roof
  const wr=Math.min(H*0.035,26*U);ell(W/2,H*0.085,wr,wr,C.lamp);g.strokeStyle='#fff';g.lineWidth=3*U;g.beginPath();g.arc(W/2,H*0.085,wr,0,TAU);g.moveTo(W/2-wr,H*0.085);g.lineTo(W/2+wr,H*0.085);g.moveTo(W/2,H*0.085-wr);g.lineTo(W/2,H*0.085+wr);g.stroke();}

function drawDoor(d,t){const{x,y,w,h}=d;
  // frame
  g.fillStyle='rgba(255,255,255,0.85)';arch(x-w*0.07,y-w*0.07,w*1.14,h+w*0.07);g.fill();
  // inside
  if(d.open>0){g.save();arch(x,y,w,h);g.clip();const gr=g.createRadialGradient(x+w/2,y+h*0.35,0,x+w/2,y+h*0.35,h*0.8);gr.addColorStop(0,C.lamp);gr.addColorStop(1,C.inside);g.fillStyle=gr;g.fillRect(x,y,w,h);
    if(d.animal){const s=w*0.3;const e=easeOutBack(clamp(d.open*1.3-0.3,0,1));const b=d.pop*Math.sin(d.pop*14)*0.12;g.save();g.translate(x+w/2,y+h*0.62+(1-e)*h*0.5-Math.abs(Math.sin(t*2))*2*U);g.rotate(Math.sin(t*2.2)*0.05+d.joy*Math.sin(t*16)*0.12);g.scale(1+b,1-b);
      drawAnimal(d.animal,s,t,d.joy>0.2,d.talk>0);g.restore();}
    g.fillStyle='rgba(255,255,255,0.9)';g.fillRect(x,y+h*0.9,w,h*0.1);g.restore();}
  // door panel (swings from the left hinge)
  const k=1-d.open*0.86;const wig=Math.sin(t*40)*d.wig*0.03;
  g.save();g.translate(x,y);g.scale(k,1);g.rotate(wig);
  arch(0,0,w,h);g.fillStyle=d.col;g.fill();
  g.fillStyle='rgba(255,255,255,0.18)';arch(w*0.14,w*0.14,w*0.72,h*0.42);g.fill();
  g.fillStyle='rgba(0,0,0,0.08)';g.fillRect(w*0.14,h*0.6,w*0.72,h*0.28);
  if(d.open<0.95){ell(w*0.82,h*0.58,w*0.06,w*0.06,'#ffe08a');}
  g.restore();
  if(d.open>0&&k<1){g.fillStyle='rgba(0,0,0,0.12)';g.fillRect(x+w*k,y+w*0.2,3*U,h-w*0.2);}}

function drawParts(){for(const p of parts){g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=p.col;if(p.heart){heartPath(p.x,p.y,p.s);g.fill();}else{g.beginPath();g.arc(p.x,p.y,p.s*0.6,0,TAU);g.fill();}}g.globalAlpha=1;}
const t0=performance.now()/1000;
function drawOverlay(t){const e=t-t0;if(e<3.4){const a=clamp(Math.min(e/0.4,(3.4-e)/0.6),0,1);const fs=Math.round(26*U);g.save();g.globalAlpha=a;g.font=`900 ${fs}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=fs*0.25;g.strokeStyle='rgba(255,255,255,0.8)';g.strokeText('トントン だれかな？',W/2,H*0.155);g.fillStyle=C.ink;g.fillText('トントン だれかな？',W/2,H*0.155);g.restore();}
  if(!opened){const d=doors[0];const hx=d.x+d.w/2,hy=d.y+d.h*0.55;for(let k=0;k<2;k++){const p=(t*0.9+k*0.5)%1;g.strokeStyle=`rgba(255,255,255,${(1-p)*0.9})`;g.lineWidth=4*U;g.beginPath();g.arc(hx,hy,(10+p*40)*U,0,TAU);g.stroke();}}}

/* ---------- input ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);
  for(const d of doors){const m=d.w*0.1;if(x>d.x-m&&x<d.x+d.w+m&&y>d.y-m&&y<d.y+d.h+m){tapDoor(d);return;}}
  burst(x,y,4);tone(rand(700,1100),0.12,'sine',0.06);});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

resize();
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;update(dt);g.clearRect(0,0,W,H);drawBG(t);doors.forEach(d=>drawDoor(d,t));drawParts();drawOverlay(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
