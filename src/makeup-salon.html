<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>おしゃれ メイクやさん</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#fff0f6;--bg2:#ffe3ef;--panel:rgba(255,255,255,0.62);--panel-edge:rgba(160,90,130,0.25);--ink:#7a3f5f;--sel:#ff5c9e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#341f2c;--bg2:#271a25;--panel:rgba(255,255,255,0.1);--panel-edge:rgba(255,210,235,0.3);--ink:#ffd9ea;--sel:#ff8fc0}}
:root[data-theme="dark"]{--bg1:#341f2c;--bg2:#271a25;--panel:rgba(255,255,255,0.1);--panel-edge:rgba(255,210,235,0.3);--ink:#ffd9ea;--sel:#ff8fc0}
html{height:100%;background:linear-gradient(#fff0f6,#ffe3ef)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg1);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c" aria-label="おしゃれメイクやさん。したの どうぐと いろを えらんで、かおを なぞると おけしょうが できます"></canvas>
<script>
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';
const EMO='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let W=0,H=0,U=1,DPR=1,C={};
function readColors(){const s=getComputedStyle(document.documentElement);['bg1','bg2','panel','panel-edge','ink','sel'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}

/* ---------- おと と こえ ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=0.95;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
try{speechSynthesis.getVoices();}catch(e){}
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5];

/* ---------- どうぐ ---------- */
const TOOLS=[
  {k:'lip',  e:'💄',n:'くちべに'},
  {k:'cheek',e:'🌸',n:'ほっぺ'},
  {k:'eye',  e:'🎨',n:'めのうえ'},
  {k:'glit', e:'✨',n:'キラキラ'},
  {k:'deco', e:'🎀',n:'かざり'},
  {k:'hair', e:'💇',n:'かみのけ'}
];
const COLORS=['#ff5c8a','#e8384f','#b06bff','#4cc3ff','#ffc233','#4fd18b'];
const DECOS=['🎀','👑','🌸','⭐','🦋','💎','🍓','🌼','💖','🌈'];
const SKIN='#ffdfc8',SKIN2='#f6c9ae';
let tool=0,color=0,hair='#8a5a44',marks=[],decos=[],drawing=false,lastP=null,state='play',doneT=0,parts=[],touched=false;
const HAIRS=['#8a5a44','#3d2b2b','#d9a441','#ff8fc0','#9b7bd4','#5bc8ff'];

/* ---------- かおの かたち ---------- */
let F={x:0,y:0,r:10},barH=0,topY=0;
function layout(){
  const tr=Math.min(Math.min(W/TOOLS.length,74*U)*0.42,27*U);
  const cr=Math.min(Math.min(W/COLORS.length,62*U)*0.34,21*U);
  barH=tr*2+cr*2+30*U;
  topY=Math.max(H*0.055,34*U)+18*U;
  const area=H-barH-topY;
  F.r=Math.min(W*0.37,area*0.42);
  F.x=W/2;F.y=topY+area*0.5;
}
/* どうぐが ぬれる ばしょ（かおの なかの ざひょう。r=1） */
function inRegion(k,lx,ly){
  if(k==='glit')return lx*lx+ly*ly<1.0;
  if(k==='deco'||k==='hair')return lx*lx+ly*ly<1.45;
  if(k==='lip'){const dx=lx/0.3,dy=(ly-0.44)/0.2;return dx*dx+dy*dy<1;}
  if(k==='cheek'){for(const s of[-1,1]){const dx=(lx-s*0.5)/0.28,dy=(ly-0.3)/0.23;if(dx*dx+dy*dy<1)return true;}return false;}
  if(k==='eye'){for(const s of[-1,1]){const dx=(lx-s*0.36)/0.27,dy=(ly+0.21)/0.14;if(dx*dx+dy*dy<1)return true;}return false;}
  return false;
}
function regionPath(ctx,k,ox,oy,sc){
  ctx.beginPath();
  if(k==='lip')ctx.ellipse(ox,oy+0.44*sc,0.3*sc,0.2*sc,0,0,TAU);
  else if(k==='cheek'){for(const s of[-1,1]){ctx.moveTo(ox+s*0.5*sc+0.28*sc,oy+0.3*sc);ctx.ellipse(ox+s*0.5*sc,oy+0.3*sc,0.28*sc,0.23*sc,0,0,TAU);}}
  else if(k==='eye'){for(const s of[-1,1]){ctx.moveTo(ox+s*0.36*sc+0.27*sc,oy-0.21*sc);ctx.ellipse(ox+s*0.36*sc,oy-0.21*sc,0.27*sc,0.14*sc,0,0,TAU);}}
  else ctx.ellipse(ox,oy,sc,sc,0,0,TAU);
}

/* ---------- メイクの レイヤー ---------- */
let LU,GU,LO,GO,LS=0;
function buildLayers(){
  LS=Math.max(32,Math.ceil(F.r*2.6));
  LU=document.createElement('canvas');LO=document.createElement('canvas');
  LU.width=LO.width=LU.height=LO.height=Math.ceil(LS*DPR);
  GU=LU.getContext('2d');GO=LO.getContext('2d');
  GU.setTransform(DPR,0,0,DPR,0,0);GO.setTransform(DPR,0,0,DPR,0,0);
  redraw();
}
const isOver=k=>k==='lip'||k==='glit';
function paint(m){
  const ctx=isOver(m.k)?GO:GU,px=(m.x+1.3)*F.r,py=(m.y+1.3)*F.r;
  ctx.save();
  if(m.k==='glit'){
    ctx.fillStyle=m.c;ctx.globalAlpha=0.95;
    const s=F.r*0.075;
    ctx.translate(px,py);ctx.rotate(m.a);
    ctx.beginPath();
    for(let i=0;i<8;i++){const rr=i%2?s*0.36:s;const an=i/8*TAU;ctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}
    ctx.closePath();ctx.fill();
  }else{
    const r=m.k==='lip'?F.r*0.085:m.k==='eye'?F.r*0.1:F.r*0.19;
    const gr=ctx.createRadialGradient(px,py,0,px,py,r);
    const a=m.k==='lip'?0.5:m.k==='eye'?0.32:0.26;
    gr.addColorStop(0,m.c);gr.addColorStop(1,m.c+'00');
    ctx.globalAlpha=a;ctx.fillStyle=gr;
    ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function redraw(){
  if(!GU)return;
  GU.clearRect(0,0,LS,LS);GO.clearRect(0,0,LS,LS);
  for(const m of marks)paint(m);
}
function addMark(k,lx,ly){
  const m={k,x:lx,y:ly,c:COLORS[color],a:rand(0,TAU)};
  marks.push(m);paint(m);
  if(marks.length>2600)marks.splice(0,600);
}

/* ---------- そうさ ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function toolBtns(){
  const n=TOOLS.length,bw=Math.min(W/n,74*U),r=Math.min(bw*0.42,27*U);
  const y=H-barH+r+12*U;
  return TOOLS.map((t,i)=>({k:t.k,e:t.e,n:t.n,i,x:W/2+(i-(n-1)/2)*bw,y,r}));
}
function colorBtns(){
  const n=COLORS.length,bw=Math.min(W/n,62*U),r=Math.min(bw*0.34,21*U);
  const y=H-r-16*U;
  return COLORS.map((c,i)=>({c,i,x:W/2+(i-(n-1)/2)*bw,y,r}));
}
function topBtns(){
  const r=24*U,y=Math.max(H*0.05,32*U);
  return[{k:'done',e:'✨',x:W-r-16*U,y,r},{k:'clear',e:'🧹',x:W-r*3-28*U,y,r}];
}
function local(x,y){return[(x-F.x)/F.r,(y-F.y)/F.r];}
function tryPaint(x,y){
  const p=local(x,y),lx=p[0],ly=p[1],k=TOOLS[tool].k;
  if(k==='hair'){
    if(lx*lx+ly*ly<1.45){hair=HAIRS[(HAIRS.indexOf(hair)+1)%HAIRS.length];tone(560,0.16,'sine',0.11,0,760);touched=true;}
    return;
  }
  if(k==='deco'){
    if(inRegion('deco',lx,ly)){decos.push({e:DECOS[ri(DECOS.length)],x:lx,y:ly,s:rand(0.9,1.25),a:rand(-0.3,0.3),t:0});
      tone(PENTA[4+ri(5)],0.2,'triangle',0.11);touched=true;}
    return;
  }
  if(!inRegion(k,lx,ly))return;
  addMark(k,lx,ly);touched=true;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  const p=pos(e),x=p[0],y=p[1];
  if(state==='done'){if(doneT>0.7){state='play';parts=[];tone(520,0.14,'sine',0.1,0,720);}return;}
  for(const b of topBtns())if(Math.hypot(x-b.x,y-b.y)<b.r*1.35){
    if(b.k==='clear'){marks=[];decos=[];hair=HAIRS[0];redraw();touched=false;tone(300,0.2,'sine',0.1,0,180);say('きれいに なったよ');}
    else finish();
    return;
  }
  for(const b of toolBtns())if(Math.hypot(x-b.x,y-b.y)<b.r*1.3){tool=b.i;tone(640,0.12,'sine',0.11,0,880);say(b.n);return;}
  for(const b of colorBtns())if(Math.hypot(x-b.x,y-b.y)<b.r*1.5){color=b.i;tone(760,0.12,'sine',0.1,0,980);return;}
  drawing=true;lastP=[x,y];tryPaint(x,y);
});
cv.addEventListener('pointermove',e=>{
  if(!drawing||state!=='play')return;
  e.preventDefault();
  const p=pos(e),x=p[0],y=p[1],k=TOOLS[tool].k;
  if(k==='deco'||k==='hair'){lastP=[x,y];return;}
  const dx=x-lastP[0],dy=y-lastP[1],d=Math.hypot(dx,dy);
  const step=F.r*(k==='glit'?0.16:0.07);
  if(d<step)return;
  const n=Math.min(24,Math.ceil(d/step));
  for(let i=1;i<=n;i++)tryPaint(lastP[0]+dx*i/n,lastP[1]+dy*i/n);
  lastP=[x,y];
});
addEventListener('pointerup',()=>{drawing=false;});
addEventListener('pointercancel',()=>{drawing=false;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

function finish(){
  state='done';doneT=0;
  [0,2,4,7,9].forEach((k,i)=>tone(PENTA[k+2],0.42,'triangle',0.11,i*0.1));
  for(let i=0;i<42;i++){const a=Math.random()*TAU,v=rand(120,300)*U;
    parts.push({x:F.x,y:F.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-110*U,life:0,max:rand(0.9,1.6),
      c:['#ff8fc0','#ffd166','#c3a6ff','#8ee6ff','#ffffff'][i%5],s:rand(3,7)*U});}
  setTimeout(()=>say(touched?'わあ かわいい！ すてきだね':'どうぐを えらんで おけしょう してみてね'),450);
}

/* ---------- びょうが ---------- */
function emoji(e,x,y,s,a){g.save();g.globalAlpha=(a===undefined?1:a)*g.globalAlpha;g.fillStyle='#000';g.font=Math.round(s)+'px '+EMO;g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);g.restore();}
function drawBG(t){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,C.bg1);gr.addColorStop(1,C.bg2);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){
    const x=((i*137.5)%100)/100*W,y=((i*61.8)%100)/100*(H-barH);
    const tw=0.35+0.3*Math.sin(t*1.6+i);
    emoji(i%2?'✨':'💗',x,y,18*U,tw*0.55);
  }
}
function drawEye(s,t){
  const ex=F.x+s*F.r*0.36,ey=F.y,r=F.r;
  g.fillStyle='#fff';g.beginPath();g.ellipse(ex,ey,r*0.15,r*0.17,0,0,TAU);g.fill();
  g.fillStyle='#4a3040';g.beginPath();g.arc(ex,ey+r*0.015,r*0.1,0,TAU);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(ex-r*0.037,ey-r*0.055,r*0.036,0,TAU);g.fill();
  g.strokeStyle='#4a3040';g.lineWidth=r*0.03;g.lineCap='round';
  g.beginPath();g.arc(ex,ey,r*0.172,Math.PI*1.12,Math.PI*1.88);g.stroke();
  for(const k of[-1,0,1]){const a=Math.PI*1.5+k*0.36;
    g.beginPath();g.moveTo(ex+Math.cos(a)*r*0.18,ey+Math.sin(a)*r*0.19);
    g.lineTo(ex+Math.cos(a)*r*0.25,ey+Math.sin(a)*r*0.27);g.stroke();}
  g.strokeStyle='#8a5a44';g.lineWidth=r*0.032;
  g.beginPath();g.arc(ex,ey-r*0.02,r*0.25,Math.PI*1.22,Math.PI*1.78);g.stroke();
}
function drawFace(t,sc){
  const r=F.r*sc,x=F.x,y=F.y;
  g.save();
  // うしろがみ
  g.fillStyle=hair;g.beginPath();g.ellipse(x,y+r*0.08,r*1.14,r*1.2,0,0,TAU);g.fill();
  // みみ
  g.fillStyle=SKIN;
  for(const s of[-1,1]){g.beginPath();g.arc(x+s*r*0.95,y+r*0.1,r*0.15,0,TAU);g.fill();}
  // かお
  g.fillStyle=SKIN;g.beginPath();g.ellipse(x,y,r*0.93,r,0,0,TAU);g.fill();
  g.strokeStyle=SKIN2;g.lineWidth=r*0.02;g.stroke();
  g.restore();
  const L=r*2.6,ox=x-r*1.3,oy=y-r*1.3;
  if(LU)g.drawImage(LU,ox,oy,L,L);
  drawEye(-1,t);drawEye(1,t);
  g.strokeStyle='rgba(120,70,60,0.35)';g.lineWidth=r*0.028;g.lineCap='round';
  g.beginPath();g.arc(x,y+r*0.2,r*0.06,Math.PI*0.18,Math.PI*0.82);g.stroke();
  g.strokeStyle='#d4697f';g.lineWidth=r*0.038;
  g.beginPath();g.arc(x,y+r*0.34,r*0.15,Math.PI*0.18,Math.PI*0.82);g.stroke();
  // まえがみ（かおの なかだけ）
  g.save();
  g.beginPath();g.ellipse(x,y,r*0.93,r,0,0,TAU);g.clip();
  g.fillStyle=hair;g.beginPath();g.ellipse(x,y-r*0.86,r*1.02,r*0.53,0,0,TAU);g.fill();
  g.restore();
  if(LO)g.drawImage(LO,ox,oy,L,L);
  // かざり
  for(const d of decos)emoji(d.e,x+d.x*r,y+d.y*r,r*0.26*d.s*(1+Math.sin(d.t*6)*0.06));
}
function drawHint(t){
  const k=TOOLS[tool].k;
  if(k==='hair'||k==='deco'||k==='glit'||state!=='play')return;
  const a=0.35+0.3*Math.sin(t*3);
  g.save();g.strokeStyle='rgba(255,92,158,'+a+')';g.lineWidth=3*U;g.setLineDash([7*U,7*U]);
  regionPath(g,k,F.x,F.y,F.r);g.stroke();g.restore();
}
function roundRect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawBar(t){
  const y=H-barH;
  g.fillStyle=C.panel;roundRect(6*U,y,W-12*U,barH+20*U,22*U);g.fill();
  g.strokeStyle=C['panel-edge'];g.lineWidth=2*U;g.stroke();
  for(const b of toolBtns()){
    const on=b.i===tool;
    g.fillStyle=on?C.sel:'rgba(255,255,255,0.8)';
    g.beginPath();g.arc(b.x,b.y,b.r*(on?1.12:1),0,TAU);g.fill();
    emoji(b.e,b.x,b.y,b.r*1.25);
  }
  for(const b of colorBtns()){
    const on=b.i===color;
    if(on){g.fillStyle='rgba(255,255,255,0.95)';g.beginPath();g.arc(b.x,b.y,b.r*1.34,0,TAU);g.fill();}
    g.fillStyle=b.c;g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();
    g.strokeStyle='rgba(0,0,0,0.12)';g.lineWidth=2*U;g.stroke();
  }
}
function drawTop(t){
  for(const b of topBtns()){
    g.fillStyle='rgba(255,255,255,0.82)';g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();
    g.strokeStyle=C['panel-edge'];g.lineWidth=2*U;g.stroke();
    emoji(b.e,b.x,b.y,b.r*1.15);
  }
  g.font='900 '+Math.round(18*U)+'px '+FONT;g.fillStyle=C.ink;g.textAlign='center';g.textBaseline='middle';
  g.fillText(TOOLS[tool].n,W/2,Math.max(H*0.05,32*U));
}
function drawParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*U*dt;
    if(p.life>p.max){parts.splice(i,1);continue;}
    g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=p.c;
    g.beginPath();g.arc(p.x,p.y,p.s,0,TAU);g.fill();
  }
  g.globalAlpha=1;
}
function drawDone(t){
  g.fillStyle='rgba(255,220,238,0.35)';g.fillRect(0,0,W,H);
  const r=F.r*1.06;
  g.save();
  g.strokeStyle='#ffd166';g.lineWidth=12*U;
  g.beginPath();g.ellipse(F.x,F.y,r*1.16,r*1.24,0,0,TAU);g.stroke();
  g.strokeStyle='#fff3c4';g.lineWidth=5*U;g.stroke();
  g.restore();
  g.font='900 '+Math.round(26*U)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=C.ink;
  g.fillText('できた！ かわいい！',W/2,F.y-r*1.4);
  g.font='900 '+Math.round(15*U)+'px '+FONT;
  g.fillText('さわると つづきが できるよ',W/2,F.y+r*1.44);
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);
  U=clamp(Math.min(W,H)/560,0.7,1.6);
  readColors();layout();buildLayers();
}
addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}

resize();
setTimeout(()=>say('どうぐと いろを えらんで、かおを なぞって おけしょう しよう'),700);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  for(const d of decos)d.t+=dt;
  if(state==='done')doneT+=dt;
  g.clearRect(0,0,W,H);
  drawBG(t);
  const sc=state==='done'?1.06:1;
  drawFace(t,sc);
  if(state==='play')drawHint(t);
  if(state==='done')drawDone(t);
  drawParts(dt);
  if(state==='play'){drawBar(t);drawTop(t);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
