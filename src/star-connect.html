<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ほしつなぎ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sky-top:#262a6b;--sky-bottom:#5a4aa8;--hill:#1c1f4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky-top:#12153d;--sky-bottom:#3a2f7a;--hill:#0d0f2e}}
:root[data-theme="dark"]{--sky-top:#12153d;--sky-bottom:#3a2f7a;--hill:#0d0f2e}
html{height:100%;background:linear-gradient(var(--sky-top) 50%,var(--hill) 50%)}
body{height:100%;margin:0;overflow:hidden;background:var(--sky-top);overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c" aria-label="ほしつなぎ。ほしをさわってつなげると、かたちがうまれます"></canvas>
<script>
(()=>{
const TAU=Math.PI*2;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif';

function heartPts(){const a=[];for(let i=0;i<10;i++){const t=i/10*TAU;a.push([16*Math.pow(Math.sin(t),3)/17,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17+0.1]);}return a;}
function starPts(){const a=[];for(let i=0;i<10;i++){const t=-Math.PI/2+i*Math.PI/5,r=i%2?0.42:1;a.push([Math.cos(t)*r,Math.sin(t)*r+0.08]);}return a;}
const SHAPES=[
 {name:'さんかく',color:'#ffd166',pts:[[0,-0.85],[0.9,0.7],[-0.9,0.7]],face:[0,0.25]},
 {name:'しかく',color:'#6fd3ff',pts:[[-0.75,-0.75],[0.75,-0.75],[0.75,0.75],[-0.75,0.75]],face:[0,0.02]},
 {name:'おうち',color:'#ff9aa2',pts:[[-0.7,0.85],[-0.7,-0.15],[0,-0.9],[0.7,-0.15],[0.7,0.85]],face:[0,0.32]},
 {name:'さかな',color:'#7ee0b5',pts:[[1,0],[0.35,-0.5],[-0.35,-0.35],[-1,-0.7],[-0.72,0],[-1,0.7],[-0.35,0.35],[0.35,0.5]],eye:[0.5,-0.08],wiggle:true},
 {name:'ハート',color:'#ff7eb6',pts:heartPts(),face:[0,0.05]},
 {name:'おほしさま',color:'#fff27a',pts:starPts(),face:[0,0.12]},
 {name:'ロケット',color:'#c9a7ff',pts:[[0,-1],[0.35,-0.45],[0.35,0.4],[0.72,0.9],[0.22,0.7],[-0.22,0.7],[-0.72,0.9],[-0.35,0.4],[-0.35,-0.45]],face:[0,-0.05]},
];

let W=0,H=0,U=1,S=100,CX=0,CY=0,R=24,cols=4,C={};
const bgStars=[],parts=[],meteors=[],col=[];
let cur=null,idx=0,phase='appear',pt=0,started=false;
function readColors(){const s=getComputedStyle(document.documentElement);['sky-top','sky-bottom','hill'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim());}
function resize(){const d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);
  U=clamp(Math.min(W,H)/560,0.7,1.6);S=Math.min(W,H*0.95)*0.3;CX=W/2;CY=H*0.57;R=clamp(Math.min(W,H)*0.052,20,40);
  cols=clamp(Math.floor(W/(110*U)),3,7);
  bgStars.length=0;for(let i=0;i<Math.round(W*H/5000);i++)bgStars.push({x:Math.random()*W,y:Math.random()*H*0.85,r:rand(0.6,1.8)*U,ph:Math.random()*TAU,sp:rand(1,3)});
  if(cur)layout(cur);readColors();}
addEventListener('resize',resize);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors)}catch(e){}

/* ---------- sound & voice ---------- */
let AC=null;
function audio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d=0.4,type='sine',v=0.18,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*0.8);gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+0.05);}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=0.9;u.pitch=1.4;const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

/* ---------- drawing helpers ---------- */
function starShape(x,y,r,rot=-Math.PI/2){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*0.5:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}
function sparkPath(x,y,s,r){g.beginPath();for(let i=0;i<8;i++){const a=r+i*Math.PI/4,rr=i%2?s*0.3:s;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}
function burst(x,y,color,n,spd=150,grav=60){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=spd*rand(0.3,1)*U;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rand(0.5,1),color,size:rand(3,6)*U,grav:grav*U,rot:Math.random()*TAU});}}
function shapePath(def,cx,cy,sc,rot){g.save();g.translate(cx,cy);g.rotate(rot);g.beginPath();def.pts.forEach((p,i)=>{i?g.lineTo(p[0]*sc,p[1]*sc):g.moveTo(p[0]*sc,p[1]*sc)});g.closePath();g.restore();}
function drawFace(def,cx,cy,sc,rot,happy){g.save();g.translate(cx,cy);g.rotate(rot);const k=sc;
  if(def.eye){const[ex,ey]=def.eye;g.fillStyle='#fff';g.beginPath();g.arc(ex*k,ey*k,0.13*k,0,TAU);g.fill();g.fillStyle='#2b2250';g.beginPath();g.arc(ex*k+0.03*k,ey*k,0.07*k,0,TAU);g.fill();g.restore();return;}
  const[fx,fy]=def.face;g.fillStyle='rgba(255,110,150,0.45)';for(const s of[-1,1]){g.beginPath();g.arc(fx*k+s*0.3*k,fy*k+0.08*k,0.07*k,0,TAU);g.fill();}
  g.strokeStyle=g.fillStyle='#2b2250';g.lineWidth=Math.max(2,0.04*k);g.lineCap='round';
  for(const s of[-1,1]){if(happy){g.beginPath();g.arc(fx*k+s*0.17*k,fy*k-0.04*k,0.07*k,Math.PI*1.1,Math.PI*1.9);g.stroke();}else{g.beginPath();g.arc(fx*k+s*0.17*k,fy*k-0.05*k,0.05*k,0,TAU);g.fill();}}
  g.beginPath();g.arc(fx*k,fy*k+0.04*k,0.12*k,0.15*Math.PI,0.85*Math.PI);g.stroke();g.restore();}

/* ---------- shape flow ---------- */
function layout(c){for(const p of c.pts){p.x=CX+p.nx*S;p.y=CY+p.ny*S;}}
function newShape(){const def=SHAPES[idx%SHAPES.length];idx++;cur={def,pts:def.pts.map((p,i)=>({nx:p[0],ny:p[1],x:0,y:0,lit:false,pop:0,ap:-i*0.13,chimed:false})),lines:def.pts.map(()=>0),fill:0};layout(cur);phase='appear';pt=0;}
function light(p,i){if(p.lit||p.ap<0)return;p.lit=true;p.pop=1;const f=PENTA[i%PENTA.length];tone(f/2,0.7,'triangle',0.17);tone(f,0.5,'sine',0.05,0.03);burst(p.x,p.y,'#ffe36e',8,160,40);}
function slotPos(i){const c=i%cols,r=Math.floor(i/cols)%2;return{x:(c+0.5)/cols*W,y:H*(0.09+r*0.1)};}
const miniScale=()=>S*0.17;
function suggested(){const n=cur.pts.length;if(!cur.pts.some(p=>p.lit))return 0;for(let i=0;i<n;i++){const p=cur.pts[i],prev=cur.pts[(i-1+n)%n];if(!p.lit&&prev.lit)return i;}return cur.pts.findIndex(p=>!p.lit);}

function update(dt,t){if(!cur)newShape();pt+=dt;const n=cur.pts.length;
  cur.pts.forEach((p,i)=>{p.ap+=dt;if(p.ap>=0&&!p.chimed){p.chimed=true;tone(PENTA[i%PENTA.length]*2,0.15,'sine',0.035);}p.pop=Math.max(0,p.pop-dt*2.5);});
  if(phase==='appear'&&cur.pts[n-1].ap>0.35)phase='play';
  if(phase==='appear'||phase==='play'){let all=true;for(let i=0;i<n;i++){const j=(i+1)%n;if(cur.pts[i].lit&&cur.pts[j].lit&&cur.lines[i]<1){cur.lines[i]=Math.min(1,cur.lines[i]+dt/0.3);if(cur.lines[i]>=1)tone(2093,0.15,'sine',0.035);}if(cur.lines[i]<1)all=false;}
    if(all){phase='celebrate';pt=0;say(cur.def.name);[0,2,4,5].forEach((k,j)=>tone(PENTA[k],0.6,'triangle',0.13,0.05+j*0.11));}}
  else if(phase==='celebrate'){cur.fill=Math.min(1,pt/0.5);if(Math.random()<dt*12){const p=cur.pts[Math.floor(Math.random()*n)];burst(p.x,p.y,cur.def.color,2,100,20);}if(pt>2.4){phase='fly';pt=0;tone(1568,0.8,'sine',0.08,0,2400);}}
  else if(phase==='fly'){if(pt>1.1){col.push({def:cur.def,tw:1});if(col.length>cols*2)col.shift();const sp=slotPos(col.length-1);burst(sp.x,sp.y,'#fff6c2',10,120,0);tone(2093,0.4,'sine',0.06);phase='wait';pt=0;}}
  else if(phase==='wait'&&pt>0.5)newShape();
  for(const c of col)c.tw=Math.max(0,c.tw-dt*1.2);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*2;if(p.life>p.max)parts.splice(i,1);}
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.t+=dt;m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.t>0.9)meteors.splice(i,1);}}

function drawBG(t){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,C['sky-top']);gr.addColorStop(1,C['sky-bottom']);g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(const s of bgStars){g.globalAlpha=0.3+0.7*(0.5+0.5*Math.sin(t*s.sp+s.ph));g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r,0,TAU);g.fill();}g.globalAlpha=1;
  g.fillStyle=C.hill;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W+20;x+=20)g.lineTo(x,H-(28+18*Math.sin(x/W*TAU*1.4+1))*U);g.lineTo(W+20,H);g.closePath();g.fill();}

function drawCollection(t){const m=miniScale();col.forEach((c,i)=>{const{x,y}=slotPos(i);const s=m*(1+c.tw*0.35);g.save();g.globalAlpha=0.55+0.25*Math.sin(t*1.5+i)+c.tw*0.2;
  shapePath(c.def,x,y,s,0);g.fillStyle=c.def.color+'55';g.fill();g.strokeStyle='#fff6c2';g.lineWidth=1.5*U;g.stroke();
  g.fillStyle='#fff';for(const p of c.def.pts){g.beginPath();g.arc(x+p[0]*s,y+p[1]*s,2.2*U,0,TAU);g.fill();}g.restore();});}

function drawNode(p,i,t,sug){const ap=clamp(p.ap/0.35,0,1);if(ap<=0)return;let r=R*easeOutBack(ap)*(1+p.pop*0.35);
  if(!p.lit){if(i===sug&&phase==='play')r*=1+0.14*Math.sin(t*6);g.save();if(i===sug){g.shadowColor='#fff';g.shadowBlur=14*U;}
    starShape(p.x,p.y,r);g.fillStyle='rgba(255,255,255,0.14)';g.fill();g.lineJoin='round';g.lineWidth=2.5*U;g.strokeStyle='rgba(255,255,255,0.75)';g.stroke();g.restore();
    g.fillStyle='rgba(255,255,255,0.9)';g.font=`700 ${Math.round(r*0.62)}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(i+1),p.x,p.y+r*0.1);}
  else{g.save();g.shadowColor='#ffd84a';g.shadowBlur=22*U;starShape(p.x,p.y,r,-Math.PI/2+Math.sin(t*3+i)*0.1);g.fillStyle='#ffe36e';g.fill();g.lineJoin='round';g.lineWidth=4*U;g.strokeStyle='#ffe36e';g.stroke();g.restore();
    g.strokeStyle='#7a4a1a';g.lineWidth=Math.max(1.5,r*0.09);g.lineCap='round';for(const s of[-1,1]){g.beginPath();g.arc(p.x+s*r*0.2,p.y+r*0.02,r*0.1,Math.PI*1.1,Math.PI*1.9);g.stroke();}
    g.beginPath();g.arc(p.x,p.y+r*0.14,r*0.13,0.15*Math.PI,0.85*Math.PI);g.stroke();}}

function drawCurrent(t){if(!cur)return;const n=cur.pts.length;const def=cur.def;
  if(phase==='appear'||phase==='play'){
    g.save();g.setLineDash([4*U,9*U]);g.strokeStyle='rgba(255,255,255,0.22)';g.lineWidth=2*U;g.beginPath();cur.pts.forEach((p,i)=>{i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)});g.closePath();g.stroke();g.restore();
    g.save();g.shadowColor='#ffe36e';g.shadowBlur=16*U;g.strokeStyle='#fff6c2';g.lineWidth=6*U;g.lineCap='round';
    for(let i=0;i<n;i++){const k=cur.lines[i];if(k<=0)continue;const a=cur.pts[i],b=cur.pts[(i+1)%n];g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k);g.stroke();}g.restore();
    const sug=suggested();cur.pts.forEach((p,i)=>drawNode(p,i,t,sug));return;}
  let cx=CX,cy=CY,sc=S,rot=0,alpha=1;
  if(phase==='celebrate'){sc=S*(1+0.1*Math.sin(pt*9)*Math.exp(-pt*1.2));if(def.wiggle)rot=Math.sin(pt*10)*0.1;}
  else if(phase==='fly'){const e=easeInOut(Math.min(1,pt/1.1));const sp=slotPos(col.length);cx=CX+(sp.x-CX)*e;cy=CY+(sp.y-CY)*e;sc=S+(miniScale()-S)*e;}
  else return;
  g.save();g.globalAlpha=alpha;shapePath(def,cx,cy,sc,rot);g.shadowColor=def.color;g.shadowBlur=30*U;g.fillStyle=def.color;g.globalAlpha=cur.fill;g.fill();g.globalAlpha=1;g.shadowBlur=0;g.lineJoin='round';g.lineWidth=Math.max(2,6*U*sc/S);g.strokeStyle='#fff6c2';g.stroke();g.restore();
  drawFace(def,cx,cy,sc,rot,phase==='celebrate'&&Math.sin(pt*4)>0.6);
  if(phase==='celebrate'){const a=clamp(Math.min(pt/0.3,(2.4-pt)/0.4),0,1);g.save();g.globalAlpha=a;const fs=Math.round(clamp(S*0.34,28,58));g.font=`900 ${fs}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=fs*0.22;g.strokeStyle='rgba(20,20,60,0.55)';const ty=Math.min(H-fs*0.9,CY+S*1.05+fs*0.7);g.strokeText(def.name,CX,ty);g.fillStyle=def.color;g.fillText(def.name,CX,ty);g.restore();}}

function drawParts(){for(const p of parts){g.globalAlpha=clamp(1-p.life/p.max,0,1);g.fillStyle=p.color;sparkPath(p.x,p.y,p.size*1.6,p.rot);g.fill();}g.globalAlpha=1;
  for(const m of meteors){const a=1-m.t/0.9;const gr=g.createLinearGradient(m.x,m.y,m.x-m.vx*0.18,m.y-m.vy*0.18);gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.strokeStyle=gr;g.lineWidth=3*U;g.lineCap='round';g.beginPath();g.moveTo(m.x,m.y);g.lineTo(m.x-m.vx*0.18,m.y-m.vy*0.18);g.stroke();}}

const t0=performance.now()/1000;
function drawOverlay(t){const e=t-t0;if(e<3.4){const a=clamp(Math.min(e/0.4,(3.4-e)/0.6),0,1);const fs=Math.round(34*U);g.save();g.globalAlpha=a;g.font=`900 ${fs}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff6c2';g.fillText('ほしつなぎ',W/2,H*0.12);g.restore();}}

/* ---------- input ---------- */
const down=new Set();
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function touchStars(x,y){if(!cur||(phase!=='play'&&phase!=='appear'))return false;let hit=false;cur.pts.forEach((p,i)=>{if(Math.hypot(x-p.x,y-p.y)<R*1.5){hit=true;light(p,i);}});return hit;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();started=true;down.add(e.pointerId);const[x,y]=pos(e);
  if(touchStars(x,y))return;
  const m=miniScale();for(let i=0;i<col.length;i++){const sp=slotPos(i);if(Math.hypot(x-sp.x,y-sp.y)<m*1.3+10*U){col[i].tw=1;say(col[i].def.name);[0,2,4].forEach((k,j)=>tone(PENTA[k+3],0.3,'sine',0.08,j*0.07));return;}}
  meteors.push({x,y,vx:rand(260,380)*U*(Math.random()<0.5?-1:1),vy:rand(160,240)*U,t:0});tone(PENTA[Math.floor(Math.random()*PENTA.length)]*2,0.5,'sine',0.06);burst(x,y,'#ffffff',5,90,0);});
cv.addEventListener('pointermove',e=>{if(!down.has(e.pointerId))return;const[x,y]=pos(e);touchStars(x,y);if(Math.random()<0.5)parts.push({x,y,vx:rand(-20,20)*U,vy:rand(-20,20)*U,life:0,max:0.6,color:'#fff6c2',size:rand(2,4)*U,grav:30*U,rot:0});});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>down.delete(e.pointerId)));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
try{speechSynthesis.getVoices();}catch(e){}

resize();
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;update(dt,t);g.clearRect(0,0,W,H);drawBG(t);drawCollection(t);drawCurrent(t);drawParts();drawOverlay(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
